<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Emberfall</title>
<meta name="theme-color" content="#0d1a0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emberfall">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800;900&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a120a;color:#e8f0e8;font:600 15px/1.3 'Roboto Condensed',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
/* menus: allow touch / scroll / text input */
body:not(.g){touch-action:manipulation;-webkit-user-select:auto;user-select:auto}
body.g{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

h1,h2{font-family:'Exo 2',sans-serif;font-weight:900;color:#7dff6b;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 20px #3dff3a55}
h1{font-size:clamp(30px,7.5vw,64px);line-height:1}h1 small{display:block;font-size:.3em;letter-spacing:.4em;color:#9ab89a;text-shadow:none;margin-top:4px}
h2{font-size:clamp(22px,5vw,38px)}
.sc{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));text-align:center;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:linear-gradient(180deg,rgba(8,18,8,.93),rgba(10,20,10,.78) 45%,rgba(6,14,6,.95));z-index:5}
.sc.on{display:flex}#o{background:rgba(6,14,6,.9);backdrop-filter:blur(8px)}
button,input,select{font:inherit;font-weight:700;padding:.65em 1.1em;border-radius:2px;border:2px solid #2a4a2a;background:#142014ee;color:#e8f0e8;pointer-events:auto;touch-action:manipulation}
button{cursor:pointer;text-transform:uppercase;transition:transform .1s,box-shadow .1s;-webkit-user-select:none;user-select:none}
button.p{background:linear-gradient(180deg,#5dde4a,#2a9a22);border-color:#9dff8a;color:#061206;box-shadow:0 3px 0 #1a6014,0 0 16px #3dff3a44;padding:.65em 1.6em;min-height:48px}
button.p:active{transform:translateY(2px);box-shadow:0 1px 0 #1a6014}button:disabled{opacity:.4}
button.l{background:none;border:0;text-decoration:underline;font-weight:500;text-transform:none;color:#8ab88a;min-height:44px}
/* 16px+ prevents iOS auto-zoom on focus */
input,select{width:min(18em,86vw);max-width:320px;text-align:center;user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;background:#0c180cee;font-size:16px;min-height:48px;touch-action:manipulation}
#jc{width:5.5em;text-transform:uppercase;letter-spacing:.25em;font-size:16px}
#au,#ap{width:min(18em,86vw);max-width:320px}

.r{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.t{max-width:48ch;color:#a8c0a8}.m{color:#9dff8a;min-height:1.3em}
.cd{width:112px;padding:5px;text-align:center;font-size:10px;line-height:1.2;background:linear-gradient(180deg,#1a2a1a,#0c140c);border:2px solid #2a4a2a;border-radius:2px}
.cd b{display:block;font-size:13px;text-transform:uppercase;font-family:'Exo 2',sans-serif}.cd canvas{width:84px;height:104px;display:block;margin:0 auto}
.cd:hover{transform:translateY(-2px)}.cd.on{border-color:var(--c);box-shadow:0 0 16px var(--c)}
.pl{border:2px solid var(--c);padding:8px 14px;min-width:110px;background:#0c140cee;text-align:center;border-radius:2px;position:relative}
.pl b{display:block;font-size:15px;font-family:'Exo 2',sans-serif}.pl .rdy{font-size:10px;color:#7dff6b}
#rc{letter-spacing:.2em;color:#fff}.st{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.st div{text-align:center}.st b{display:block;font:900 26px 'Exo 2';color:#7dff6b}
#h{display:none;position:fixed;inset:0;pointer-events:none}body.g #h{display:block}
#tp{position:absolute;top:calc(5px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:5px;font-size:13px;font-family:'Exo 2',sans-serif}
#tp span{background:#0a140add;padding:2px 10px;border:1px solid #2a5a2a;border-radius:2px}#st{border-color:#6b8dff!important;color:#b0c4ff}
#mm{position:absolute;top:calc(5px + env(safe-area-inset-top));right:calc(5px + env(safe-area-inset-right));width:96px;height:96px;border-radius:3px;border:2px solid #3a6a3a55;background:#0a140add}
#kf{position:absolute;top:calc(5px + env(safe-area-inset-top));left:calc(6px + env(safe-area-inset-left));font-size:12px;text-shadow:0 1px 2px #000;font-family:'Exo 2',sans-serif}
#kf div{background:#0a140add;padding:2px 7px;margin-bottom:2px;border-left:3px solid #7dff6b}
#cap{position:absolute;top:18%;width:100%;text-align:center;font:900 clamp(15px,3.5vw,26px) 'Exo 2';color:#9dff8a;text-shadow:0 0 10px #000;opacity:0;transition:opacity .3s}#cap.on{opacity:1}
#xh{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;--c:#fff;transition:transform .08s}
#xh:before,#xh:after{content:"";position:absolute;filter:drop-shadow(0 0 1px #000)}
#xh:before{left:11px;top:0;width:2px;height:24px;background:linear-gradient(var(--c) 0 7px,transparent 7px 17px,var(--c) 17px)}
#xh:after{top:11px;left:0;height:2px;width:24px;background:linear-gradient(90deg,var(--c) 0 7px,transparent 7px 17px,var(--c) 17px)}
#xh.hit{--c:#ff3b30;transform:scale(1.3)}#xh.hs{--c:#ffe14a}#xh.ads{transform:scale(.75);opacity:.85}
#xh.auto{--c:#ffe14a;transform:scale(1.15);filter:drop-shadow(0 0 4px #ffe14a)}
#dv{position:absolute;inset:0;box-shadow:inset 0 0 90px #f22;opacity:0;transition:opacity .25s}
#sv{position:absolute;inset:0;box-shadow:inset 0 0 110px #4a6dff;opacity:0;transition:opacity .4s}
#am{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom));text-align:center;font:800 18px 'Exo 2';text-shadow:0 0 4px #000}
#am small{display:block;font:600 11px 'Roboto Condensed';color:#9dff8a}
#hb{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(40px + env(safe-area-inset-bottom));width:min(240px,40vw);height:10px;background:#0a140add;border:1px solid #3a5a3a;border-radius:2px}
#hb i{position:absolute;left:0;height:100%;transition:width .1s}#hbar{background:linear-gradient(90deg,#3dff3a,#7dff6b);top:0}#sb{background:#4ac8ff;top:-4px;height:3px!important}
#inv{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:4px}
.islot{width:46px;height:46px;background:#0a140add;border:2px solid #2a4a2a;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:#a8c0a8;position:relative}
.islot.on{border-color:#7dff6b;box-shadow:0 0 10px #3dff3a44}
.islot .ic{font:700 9px 'Exo 2';color:#fff;max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.islot .iq{position:absolute;bottom:1px;right:2px;font-size:9px;color:#9dff8a}
.islot .ik{position:absolute;top:1px;left:2px;font-size:8px;color:#5a7a5a}
#stamina{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(52px + env(safe-area-inset-bottom));width:min(140px,26vw);height:3px;background:#0a140a88;border-radius:1px;overflow:hidden}
#stamina i{display:block;height:100%;background:linear-gradient(90deg,#7dff6b,#3dff3a);transition:width .08s}
#xpbar{position:absolute;top:calc(5px + env(safe-area-inset-top));left:calc(6px + env(safe-area-inset-left));width:100px;height:4px;background:#0a140add;border-radius:1px;margin-top:72px;display:none}
body.g #xpbar{display:block}#xpbar i{display:block;height:100%;background:#c4b5fd;transition:width .3s}
#sbd{display:none;position:fixed;inset:0;background:#0a140aee;z-index:8;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-family:'Exo 2',sans-serif}
#sbd.on{display:flex}#sbd table{border-collapse:collapse;min-width:280px}#sbd th,#sbd td{padding:6px 14px;text-align:left;border-bottom:1px solid #2a4a2a}
#sbd th{color:#7dff6b;font-size:12px}#sbd .me{color:#9dff8a}
/* CODM-style mobile controls — edges only, clear center view */
#js{position:absolute;left:calc(12px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.22);display:none}
#js i{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:rgba(125,255,107,.35);border:2px solid rgba(125,255,107,.65);box-shadow:0 0 12px rgba(125,255,107,.25)}
.tc{position:absolute;display:none;pointer-events:auto;align-items:center;justify-content:center;border-radius:50%;padding:0;background:rgba(8,16,8,.62);border:2px solid rgba(255,255,255,.28);color:#f0fff0;touch-action:none;opacity:.95;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tc svg{width:52%;height:52%;display:block;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
#bf svg{width:48%;height:48%;color:#e8ffe8}
#bm{color:#7dff6b}#bc{color:#7dd3fc}#bads{color:#d8b4fe}#bml{color:#fdba74}#br{color:#fde68a}

/* Fire — primary, bottom-right (CODM) */
#bf{right:calc(16px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:86px;height:86px;background:radial-gradient(circle at 40% 35%,#7dff6b,#1a7014 70%);border-color:rgba(157,255,138,.85);box-shadow:0 0 22px rgba(61,255,58,.35);color:#fff}
/* Jump — left of fire */
#bj{right:calc(112px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));width:52px;height:52px}
/* Crouch/slide — above jump */
#bcr{right:calc(112px + env(safe-area-inset-right));bottom:calc(90px + env(safe-area-inset-bottom));width:48px;height:48px;border-color:rgba(180,180,180,.45)}
#bml{right:calc(168px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));width:48px;height:48px;border-color:rgba(255,180,80,.5);font-size:8px}
/* Reload — above fire */
#br{right:calc(22px + env(safe-area-inset-right));bottom:calc(118px + env(safe-area-inset-bottom));width:50px;height:50px}
/* ADS — above crouch / mid-right */
#bads{right:calc(112px + env(safe-area-inset-right));bottom:calc(148px + env(safe-area-inset-bottom));width:50px;height:50px;border-color:rgba(196,181,253,.55)}
/* Utility row — above joystick, left side (out of combat view) */
#bs{left:calc(14px + env(safe-area-inset-left));bottom:calc(150px + env(safe-area-inset-bottom));width:44px;height:44px}
#bm{left:calc(64px + env(safe-area-inset-left));bottom:calc(150px + env(safe-area-inset-bottom));width:44px;height:44px;border-color:rgba(125,255,107,.4)}
#bc{left:calc(114px + env(safe-area-inset-left));bottom:calc(150px + env(safe-area-inset-bottom));width:44px;height:44px;border-color:rgba(74,200,255,.4)}
.tc:active{background:rgba(61,255,58,.35);opacity:1;transform:scale(.94);border-color:rgba(157,255,138,.9)}
#bf:active{box-shadow:0 0 28px rgba(61,255,58,.55);transform:scale(.93)}
@media(pointer:coarse){
  body.g .tc{display:flex}
  body.g #js{display:block}
  /* lift HUD so it clears thumb zones */
  body.g #am{bottom:calc(78px + env(safe-area-inset-bottom));font-size:16px}
  body.g #hb{bottom:calc(62px + env(safe-area-inset-bottom));width:min(200px,36vw)}
  body.g #stamina{bottom:calc(74px + env(safe-area-inset-bottom))}
  body.g #inv{bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(.92)}
  body.g #mm{width:84px;height:84px;opacity:.9}
  body.g #tp{font-size:12px}
}
/* landscape phones: slightly tighter */
@media(pointer:coarse) and (max-height:420px){
  #js{width:96px;height:96px}
  #js i{left:26px;top:26px;width:44px;height:44px}
  #bf{width:72px;height:72px;font-size:11px}
  #bj,#br,#bads,#bcr{width:42px;height:42px;font-size:8px}
  #bs,#bm,#bc{width:38px;height:38px;font-size:8px}
  #bs,#bm,#bc{bottom:calc(120px + env(safe-area-inset-bottom))}
}
.nt{position:fixed;font-size:11px;transform:translate(-50%,-100%);text-shadow:0 0 2px #000;white-space:nowrap;display:none;pointer-events:none;font-family:'Exo 2',sans-serif}
#rt{position:fixed;inset:0;background:#0a120add;display:none;align-items:center;justify-content:center;z-index:9;font:900 18px 'Exo 2';text-align:center;padding:24px;pointer-events:none}
@media(orientation:portrait){body.g.mb #rt{display:flex}}
.modes,.maps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:2px 0}
.modes button,.maps button{font-size:11px;padding:.35em .75em}
.modes button.on,.maps button.on{border-color:#7dff6b;background:#1a3a1a;color:#9dff8a}
#dmgN{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font:900 22px 'Exo 2';color:#ffe14a;text-shadow:0 0 6px #000;opacity:0;pointer-events:none;transition:opacity .15s,transform .3s}
#dmgN.on{opacity:1;transform:translate(-50%,-80%)}
#loading{position:fixed;inset:0;background:#0a120a;display:flex;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:16px;font-family:'Exo 2',sans-serif}
#loading .ldb{width:200px;height:4px;background:#1a2a1a;border-radius:2px;overflow:hidden}
#loading .ldb i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#3dff3a,#7dff6b);transition:width .3s}
#loading .lvt{font-size:12px;color:#9dff8a;letter-spacing:.2em}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="h">
  <div id="sv"></div><div id="dv"></div><div id="xh"></div><div id="cap"></div>
  <div id="tp"><span id="al"></span><span id="st"></span></div>
  <canvas id="mm" width="192" height="192"></canvas>
  <div id="kf"></div>
  <div id="xpbar"><i id="xpFill" style="width:0%"></i></div>
  <div id="am"></div>
  <div id="stamina"><i id="stamBar" style="width:100%"></i></div>
  <div id="hb"><i id="sb"></i><i id="hbar"></i></div>
  <div id="inv"></div>
  <div id="js"><i id="jk"></i></div>
  <button class="tc" id="bf" aria-label="Fire" title="Fire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" opacity=".45"/></svg></button>
  <button class="tc" id="bj" aria-label="Jump" title="Jump"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V7"/><path d="M7 11l5-5 5 5"/><path d="M5 19h14" opacity=".5"/></svg></button>
  <button class="tc" id="br" aria-label="Reload" title="Reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.4"/><path d="M21 12a9 9 0 0 1-15.5 6.4"/><path d="M17 3v4h4"/><path d="M7 21v-4H3"/></svg></button>
  <button class="tc" id="bads" aria-label="ADS" title="Aim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 5v2M12 17v2M5 12h2M17 12h2"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></button>
  <button class="tc" id="bs" aria-label="Swap" title="Swap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h12l-3-3"/><path d="M17 16H5l3 3"/></svg></button>
  <button class="tc" id="bm" aria-label="Medkit" title="Med"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></svg></button>
  <button class="tc" id="bc" aria-label="Shield" title="Shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z"/></svg></button>
  <button class="tc" id="bcr" aria-label="Crouch" title="Crouch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2.5"/><path d="M8 20c0-3 1.5-5 4-5s4 2 4 5"/><path d="M9 14l-3 3M15 14l3 3"/></svg></button>
  <button class="tc" id="bml" aria-label="Melee" title="Melee"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-9 9H5v-6l9-9z"/><path d="M12 8l4 4"/></svg></button>
</div>
<div id="dmgN"></div>
<div id="sbd"><h2>SCOREBOARD</h2><table><thead><tr><th>PLAYER</th><th>K</th><th>D</th><th>SCORE</th></tr></thead><tbody id="sbb"></tbody></table><p class="t" style="margin-top:8px">Hold TAB</p></div>
<div id="nts"></div>
<div id="rt">Rotate to landscape</div>
<div id="loading"><div class="lvt">LOADING ARENA</div><div class="ldb"><i id="ldbFill"></i></div></div>
<div class="sc on" id="a">
  <h1>Emberfall<small>ARENA FPS</small></h1>
  <p class="t" id="at">Log in to enter the arena.</p>
  <form id="af" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:340px" onsubmit="return false">
  <input id="au" name="username" placeholder="Username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="next">
  <input id="ap" name="password" type="password" placeholder="Password" autocomplete="current-password" enterkeyhint="go">
  <button class="p" type="submit" id="ag" style="width:min(18em,86vw);max-width:320px">Log in</button>
  </form>
  <button class="p ib" style="display:none">Install app</button>
  <button class="l" id="as">New here? Create account</button>
  <p class="m" id="ae"></p>
</div>
<div class="sc" id="m">
  <h1>Emberfall<small>ARENA FPS</small></h1>
  <p class="t">Fast arena combat. Class loadouts. Slide, ADS, climb the board.</p>
  <p id="hi"></p>
  <div class="r" id="cl"></div>
  <div class="modes">
    <button class="on" data-mode="br">Battle Royale</button>
    <button data-mode="ffa">Free For All</button>
    <button data-mode="tdm">Team Deathmatch</button>
    <button data-mode="gg">Gun Game</button>
  </div>
  <div class="maps">
    <button class="on" data-map="0">Dust Bowl</button>
    <button data-map="1">Sky Pads</button>
    <button data-map="2">Oasis Fort</button>
    <button data-map="3">Dune Yards</button>
  </div>
  <div class="maps" id="diffs">
    <button data-diff="easy">Easy</button>
    <button class="on" data-diff="medium">Medium</button>
    <button data-diff="hard">Hard</button>
  </div>
  <div class="r">
    <button class="p" id="mk">Create room</button>
    <input id="jc" maxlength="4" placeholder="CODE">
    <button id="jn">Join</button>
  </div>
  <div class="r"><label>Sensitivity <input id="sn" type="range" min=".3" max="2.5" step=".1" value="1" style="width:120px;padding:0"></label></div>
  <button class="p ib" style="display:none">Install app</button>
  <button class="l" id="so">Sign out</button>
  <p class="m" id="mg"></p>
</div>
<div class="sc" id="l">
  <h2>Room <span id="rc"></span></h2>
  <p class="t" id="lt">Share the code. Ready up, then deploy.</p>
  <div class="r" id="pl"></div>
  <div class="r">
    <button class="p" id="rdy">Ready</button>
    <button class="p" id="go" style="display:none">Deploy</button>
    <button id="lv">Leave</button>
  </div>
</div>
<div class="sc" id="o"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

/* ===== PROCEDURAL TEXTURE SYSTEM ===== */
function makeCanvas(size){const c=document.createElement('canvas');c.width=c.height=size;return c}
function genNoise(ctx,size,amount,base){
  const img=ctx.getImageData(0,0,size,size),d=img.data;
  for(let i=0;i<d.length;i+=4){
    const n=(R()-.5)*amount;
    d[i]=Math.max(0,Math.min(255,d[i]+n));
    d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));
    d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));
  }
  ctx.putImageData(img,0,0);
}
function textureFloor(base,sand){
  const S=256,c=makeCanvas(S),x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,S,S);
  /* sand blotches */
  for(let i=0;i<180;i++){
    const r=2+R()*10;
    x.fillStyle=`rgba(${180+R()*40|0},${150+R()*30|0},${100+R()*30|0},${.08+R()*.12})`;
    x.beginPath();x.arc(R()*S,R()*S,r,0,7);x.fill();
  }
  /* cracks */
  x.strokeStyle='rgba(80,60,40,.18)';x.lineWidth=1;
  for(let i=0;i<20;i++){
    x.beginPath();let px=R()*S,py=R()*S;x.moveTo(px,py);
    for(let j=0;j<6;j++){px+=(R()-.5)*30;py+=(R()-.5)*30;x.lineTo(px,py)}
    x.stroke();
  }
  /* pebbles */
  for(let i=0;i<40;i++){
    x.fillStyle=`rgba(${90+R()*40|0},${80+R()*30|0},${60+R()*20|0},.4)`;
    x.beginPath();x.arc(R()*S,R()*S,1+R()*1.5,0,7);x.fill();
  }
  genNoise(x,S,10);
  return c;
}
function textureWall(base){
  const S=256,c=makeCanvas(S),x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,S,S);
  /* brick/stucco pattern */
  const bw=32,bh=16;
  for(let by=0;by<S;by+=bh){
    const off=(by/bh)%2?bw/2:0;
    for(let bx=-bw;bx<S;bx+=bw){
      const px=bx+off,shade=.85+R()*.3;
      x.fillStyle=`rgba(${160*shade|0},${140*shade|0},${110*shade|0},.6)`;
      x.fillRect(px+1,by+1,bw-2,bh-2);
      /* mortar lines */
      x.strokeStyle='rgba(60,45,30,.25)';x.lineWidth=1;
      x.strokeRect(px+1,by+1,bw-2,bh-2);
    }
  }
  /* grime */
  for(let i=0;i<30;i++){
    x.fillStyle=`rgba(40,30,20,${.04+R()*.08})`;
    x.beginPath();x.arc(R()*S,R()*S,5+R()*20,0,7);x.fill();
  }
  genNoise(x,S,12);
  return c;
}
function textureCrate(base){
  const S=256,c=makeCanvas(S),x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,S,S);
  /* planks */
  const pw=S/4;
  for(let i=0;i<4;i++){
    const sh=.85+R()*.3;
    x.fillStyle=`rgba(${140*sh|0},${110*sh|0},${70*sh|0},.7)`;
    x.fillRect(i*pw+1,0,pw-2,S);
    x.strokeStyle='rgba(50,35,20,.5)';x.lineWidth=2;
    x.beginPath();x.moveTo(i*pw+1,0);x.lineTo(i*pw+1,S);x.stroke();
  }
  /* nails */
  for(let i=0;i<4;i++){for(const yy of[8,S-8]){
    x.fillStyle='rgba(60,55,50,.9)';x.beginPath();x.arc(i*pw+pw/2,yy,2.5,0,7);x.fill();
  }}
  /* wood grain */
  x.strokeStyle='rgba(80,55,30,.15)';x.lineWidth=1;
  for(let i=0;i<30;i++){x.beginPath();const px=R()*S;x.moveTo(px,R()*S);x.lineTo(px+(R()-.5)*3,R()*S);x.stroke()}
  genNoise(x,S,8);
  return c;
}
function textureMetal(base){
  const S=128,c=makeCanvas(S),x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,S,S);
  /* horizontal streak lines */
  for(let i=0;i<40;i++){
    const y=R()*S;x.strokeStyle=`rgba(${255},${255},${255},${R()*.08})`;x.beginPath();x.moveTo(0,y);x.lineTo(S,y);x.stroke();
    x.strokeStyle=`rgba(0,0,0,${R()*.1})`;x.beginPath();x.moveTo(0,y+1);x.lineTo(S,y+1);x.stroke();
  }
  /* rivets */
  for(let i=0;i<8;i++){
    x.fillStyle='rgba(200,200,200,.5)';x.beginPath();x.arc(R()*S,R()*S,1.5,0,7);x.fill();
  }
  /* rust patches */
  for(let i=0;i<10;i++){
    x.fillStyle=`rgba(${140+R()*40|0},${80+R()*30|0},${40+R()*20|0},${.15+R()*.15})`;
    x.beginPath();x.arc(R()*S,R()*S,3+R()*8,0,7);x.fill();
  }
  genNoise(x,S,10);
  return c;
}
function textureRoof(base){
  const S=128,c=makeCanvas(S),x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,S,S);
  const tw=16;
  for(let ty=0;ty<S;ty+=tw){
    for(let tx=0;tx<S;tx+=tw){
      const sh=.8+R()*.3;
      x.fillStyle=`rgba(${120*sh|0},${100*sh|0},${70*sh|0},.6)`;
      x.fillRect(tx+1,ty+1,tw-2,tw-2);
      x.strokeStyle='rgba(40,30,20,.3)';x.lineWidth=1;
      x.strokeRect(tx+1,ty+1,tw-2,tw-2);
    }
  }
  genNoise(x,S,10);
  return c;
}
function textureLadder(base){
  const S=64,c=makeCanvas(S),x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,S,S);
  /* wood grain vertical */
  x.strokeStyle='rgba(40,30,20,.25)';x.lineWidth=1;

  return c;
}
function mkTex(canvas){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.encoding=THREE.sRGBEncoding;
  t.anisotropy=4;
  return t;
}
function buildTextures(theme){
  TX.floor=mkTex(textureFloor(theme.floor,theme.sand));

  TX.bldg=mkTex(textureWall(theme.bldg));
  TX.crate=mkTex(textureCrate(theme.crate));
  TX.crate2=mkTex(textureCrate(theme.crate2));
  TX.plat=mkTex(textureMetal(theme.plat));
  TX.dark=mkTex(textureMetal(theme.dark));
  TX.roof=mkTex(textureRoof(theme.roof));
  TX.ladder=mkTex(textureLadder('#8a8070'));
  TX.rail=mkTex(textureMetal('#5a5a5a'));
  TX.accent=mkTex(textureMetal(theme.accent));
}

function hgt(x,z){const d=H(x,z);if(d>WR+5)return -8;for(const p of PD){const q=H(x-p[0],z-p[1]);if(q<p[2])return p[3]||0}return Math.sin(x*.08)*Math.cos(z*.07)*.12}
function groundY(x,z,fromY){let gy=hgt(x,z);const feet=fromY!=null?fromY:gy+2;for(const c of Cl){if(x>c[0]-.4&&x<c[3]+.4&&z>c[2]-.4&&z<c[5]+.4){const top=c[4];if(top>gy+.04&&feet>=top-.5)gy=Math.max(gy,top)}}return gy}
let Ld=[]; /* ladders: [x,y0,z,y1,radius] */
function nearLadder(x,y,z){
  for(const L of Ld){
    if(H(x-L[0],z-L[2])<L[4]+.45&&y>=L[1]-.5&&y<=L[3]+.8)return L;
  }
  return null;
}

/* Enhanced ladder: attached flush to outer wall, with proper rails, rungs, and a top platform */
function addLadder(x,z,y0,y1,face){
  face=face|0;
  const railW=.09,railD=.06,rungW=.55,rungT=.045,rungD=.06;
  const h=y1-y0,mid=(y0+y1)/2;
  const railC='#6a6055',rungC='#9a8f78';
  const rmat=new THREE.MeshLambertMaterial({map:TX.rail,color:'#8a8070'});
  const gmat=new THREE.MeshLambertMaterial({map:TX.ladder,color:'#a09070'});
  /* The ladder plane sits just outside the wall. face determines which wall. */
  let lx=x,lz=z;
  /* local coordinate: 'axis' is along the ladder height (Y), 'across' is perpendicular to wall */
  let ax1,az1,ax2,az2; /* rail positions */
  if(face===0||face===1){ /* +/-z wall: rails run along x, offset in z */
    ax1=x-.3;az1=z; ax2=x+.3;az2=z;
  }else{ /* +/-x wall: rails run along z, offset in x */
    ax1=x;az1=z-.3; ax2=x;az2=z+.3;
  }
  const railGeoH=new THREE.BoxGeometry(railW,h,railD);
  const r1=new THREE.Mesh(railGeoH,rmat);r1.position.set(ax1,mid,az1);WG.add(r1);
  const r2=new THREE.Mesh(railGeoH,rmat);r2.position.set(ax2,mid,az2);WG.add(r2);
  /* side braces connecting rails at intervals */
  const steps=Math.max(4,Math.floor(h/.4));
  const rungGeo=face<2?new THREE.BoxGeometry(rungW,rungT,rungD):new THREE.BoxGeometry(rungD,rungT,rungW);
  for(let i=0;i<=steps;i++){
    const yy=y0+i*(h/steps);
    const m=new THREE.Mesh(rungGeo,gmat);m.position.set(x,yy,z);WG.add(m);
  }
  /* top platform — small landing extending outward from wall */
  const platW=.7,platD=.5;
  const platGeo=face<2?new THREE.BoxGeometry(platW,.06,platD):new THREE.BoxGeometry(platD,.06,platW);
  const plat=new THREE.Mesh(platGeo,new THREE.MeshLambertMaterial({map:TX.plat,color:'#c4b090'}));
  if(face===0)plat.position.set(x,y1+.03,z+platD/2);
  else if(face===1)plat.position.set(x,y1+.03,z-platD/2);
  else if(face===2)plat.position.set(x+platD/2,y1+.03,z);
  else plat.position.set(x-platD/2,y1+.03,z);
  WG.add(plat);
  /* grab the collider top if a solid was near, otherwise make a tiny standable platform */
  /* register the ladder climbing zone */
  Ld.push([x,y0,z,y1,.55]);
}

function box(x,y,z,w,h,d,col){const s=[w/2,h/2,d/2],o=[x,y,z],k=new THREE.Color(col);for(let a=0;a<3;a++)for(const sg of[1,-1]){const b=(a+1)%3,c=(a+2)%3,q=[[-1,-1],[1,-1],[1,1],[-1,1]];if(sg<0)q.reverse();const i0=M.p.length/3,sh=a==1?(sg>0?1.1:.55):.85;for(const[u,v]of q){const p=[0,0,0],n=[0,0,0];p[a]=o[a]+sg*s[a];p[b]=o[b]+u*s[b];p[c]=o[c]+v*s[c];n[a]=sg;M.p.push(...p);M.n.push(...n);M.c.push(k.r*sh,k.g*sh,k.b*sh);M.uv.push((u+1)/2,(v+1)/2)}M.i.push(i0,i0+1,i0+2,i0,i0+2,i0+3)}}
function solid(x,y,z,w,h,d,col){box(x,y,z,w,h,d,col);Cl.push([x-w/2,y-h/2,z-d/2,x+w/2,y+h/2,z+d/2])}

function makeLootMesh(k){
  const g=new THREE.Group(),mat=c=>new THREE.MeshLambertMaterial({color:c});
  const add=(w,h,d,x,y,z,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);g.add(m)};
  if(k<W.length){const w=W[k],t=w.type,L=w.L;add(.1,.09,L*.55,0,.02,-L*.28,w.c);add(.04,.04,L*.45,0,.03,-L*.72,'#1a1a1a');add(.05,.05,.04,0,.03,-L*.95,'#111');add(.07,.14,.08,0,-.08,-L*.12,'#2a2218');add(.05,.06,.06,0,-.04,-L*.18,'#222');
    if(t==='rifle'||t==='carbine'||t==='lmg'||t==='sniper'){add(.08,.08,L*.22,0,.01,L*.12,'#2a2a2a');add(.06,.05,L*.12,0,.04,-L*.4,'#333');if(t==='sniper'){add(.05,.05,.16,0,.1,-L*.25,'#111')}}
    if(t==='shotgun'){add(.09,.07,.18,0,0,-L*.38,'#3a3028');add(.08,.08,L*.18,0,0,L*.08,'#2a2a2a')}
    if(t==='smg'){add(.05,.14,.07,0,-.1,-L*.22,'#1a1a1a')}
    if(t==='pistol'){add(.05,.1,.05,0,-.06,-L*.2,'#1a1a1a')}
    g.scale.set(1.5,1.5,1.5);
  }else if(k===W.length){add(.42,.28,.32,0,0,0,'#f5f5f5');add(.26,.08,.03,0,0,.17,'#dc2626');add(.08,.22,.03,0,0,.17,'#dc2626')}
  else{const c=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.4,12),mat('#0ea5e9'));c.rotation.z=PI/2;g.add(c)}
  return g;
}

function gen(sd,mapId){
  const r=rng(sd),pick=a=>a[r()*a.length|0];mapId=mapId|0;
  if(WG){scene.remove(WG);WG.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
  WG=new THREE.Group();scene.add(WG);Cl=[];LT=[];TK={};Ld=[];
  PD=[[0,0,58,0],[-72,42,24,0],[72,42,24,0],[-72,-42,24,0],[72,-42,24,0],[0,78,20,mapId===1?7:0],[0,-78,20,mapId===1?7:0]];
  M={p:[],n:[],c:[],i:[],uv:[]};let id=1;
  /* themes */
  const themes=[
    {floor:'#c4a574',wall:'#a89070',crate:'#8B7355',crate2:'#A0522D',accent:'#b8956a',dark:'#8a7355',plat:'#d4b896',bldg:'#b8a078',roof:'#7a6548',sand:'#d8c49a',sky:'#e8c878'},
    {floor:'#b8a070',wall:'#9a8870',crate:'#8B7355',crate2:'#A0522D',accent:'#6a8aaa',dark:'#6a5a48',plat:'#c4b090',bldg:'#a89880',roof:'#5a6a7a',sand:'#d0bc90',sky:'#87b0d0'},
    {floor:'#c8b080',wall:'#9a8060',crate:'#8B7355',crate2:'#A0522D',accent:'#6a9a6a',dark:'#7a6848',plat:'#d4c0a0',bldg:'#c0a878',roof:'#5a7048',sand:'#e0d0a8',sky:'#90c8a0'},
    {floor:'#c0a878',wall:'#a88860',crate:'#8B7355',crate2:'#6a5a40',accent:'#c4a060',dark:'#7a6040',plat:'#d4b888',bldg:'#b89870',roof:'#6a5840',sand:'#dcc8a0',sky:'#e0b860'}
  ];
  const col=themes[mapId]||themes[0];
  scene.background=new THREE.Color(col.sky);
  scene.fog.color.set(col.sky);
  buildTextures(col);

  /* loot helper */
  const loot=(x,z,y)=>{
    const u=r();let k;
    if(u<.08)k=0;else if(u<.16)k=1;else if(u<.24)k=2;else if(u<.30)k=3;else if(u<.34)k=4;
    else if(u<.40)k=5;else if(u<.45)k=6;else if(u<.50)k=7;else if(u<.54)k=8;
    else if(u<.72)k=W.length;else if(u<.88)k=W.length+1;else return;
    const o={id:id++,x,z,y:(y!=null?y:hgt(x,z))+.9,k};
    const m=makeLootMesh(k);m.position.set(x,o.y,z);WG.add(m);o.m=m;LT.push(o);
  };

  /* textured terrain */
  const tg=new THREE.PlaneGeometry(2*WR+24,2*WR+24,64,64).rotateX(-PI/2);
  const pa=tg.attributes.position;
  for(let i=0;i<pa.count;i++){
    const x=pa.getX(i),z=pa.getZ(i);
    let h=hgt(x,z);
    const d=H(x,z);
    if(d<55)h+=Math.sin(x*.1)*Math.cos(z*.08)*.3;
    else h+=Math.sin(x*.07)*Math.cos(z*.05)*.45;
    pa.setY(i,h-.04);
  }
  tg.computeVertexNormals();
  const uvA=tg.attributes.uv;
  for(let i=0;i<uvA.count;i++)uvA.setXY(i,uvA.getX(i)*8,uvA.getY(i)*8);
  const tmat=new THREE.MeshLambertMaterial({map:TX.floor,color:'#ffffff'});
  WG.add(new THREE.Mesh(tg,tmat));

  for(const k in P){const p=P[k];if(p.bot)continue;if(p.tx==null)continue;const f=Math.min(1,dt*15);p.ph+=H(p.tx-p.x,p.tz-p.z)*1.4;p.x+=(p.tx-p.x)*f;p.y+=(p.ty-p.y)*f;p.z+=(p.tz-p.z)*f}
  for(const e of TR)if(e.l>0){e.l-=dt;if(e.l<=0)e.mesh.visible=false}
  nt+=dt;if(live==1&&nt>.08){nt=0;
    if(rf)rf.child('s/'+uid).set([me.x.toFixed(1),me.y.toFixed(1),me.z.toFixed(1),me.yaw.toFixed(2),me.pitch.toFixed(2),me.hp|0,me.sh|0,ch,me.sl[me.cs],me.al?1:0,kills,deaths].join(',')).catch(()=>{});
    hudT(t,Z);
    if(gmode==='br'&&me.al&&startN>1&&t>3&&!Object.values(P).some(p=>p.al))win();
    if((gmode==='ffa'||gmode==='tdm')&&t>MATCH_T&&!done){let best=kills;for(const k in P)if((P[k].kills|P[k].k|0)>best)best=P[k].kills|P[k].k|0;if(kills>=best&&kills>0)win();else endMatch(false,'Time up · Kills '+kills)}
  }
}
function hudT(t,Z){
  const alive=Object.values(P).filter(p=>p.al).length+(me.al?1:0);
  $('al').textContent=(gmode==='br'?'ALIVE '+alive:gmode==='gg'?'LVL '+(ggLevel+1):'K '+kills)+' · '+gmode.toUpperCase();
  if(gmode==='br'){const s=Math.ceil(Z.left),fm=x=>Math.floor(x/60)+':'+String(x%60).padStart(2,'0');$('st').textContent=t<0?'START '+Math.ceil(-t):Z.f?'CLOSING':'ZONE '+fm(s)}
  else{const left=Math.max(0,Math.ceil(MATCH_T-t));$('st').textContent=t<0?'START '+Math.ceil(-t):Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}
  const id=me.sl[me.cs];if(id>=0){const w=W[id];const empty=me.mg[me.cs]<=0&&(me.sl[1]<0||me.mg[1]<=0);$('am').innerHTML=`${me.rl>0?'RELOAD':me.swT>0?'SWAP':knifeMode?(me.ml>0?'SLASH':'KNIFE'):me.ml>0?'MELEE':empty?'0 — [V] KNIFE':me.mg[me.cs]+'/'+w.m}<small>${w.n} · ${nearLadder(me.x,me.y,me.z)?'CLIMB':me.slide?'SLIDE':me.ads?'ADS':me.crouch?'CROUCH':me.sprint?'SPRINT':'RUN'}</small>`}
  else $('am').innerHTML='[V] MELEE';
  $('hbar').style.width=me.hp+'%';$('sb').style.width=me.sh+'%';
  if(gmode==='br'){const out=t>0&&H(me.x-Z.x,me.z-Z.z)>Z.r;$('sv').style.opacity=out?.8:0;scene.fog.color.set(out?'#6a7acc':'#a8c8e8')}else{$('sv').style.opacity=0;scene.fog.color.set('#a8c8e8')}
}

const mm=$('mm').getContext('2d'),nts=$('nts'),NT={},V=new THREE.Vector3();
function minimap(Z){
  const s=96/(WR+10);mm.clearRect(0,0,192,192);mm.save();mm.translate(96,96);
  mm.fillStyle='#3a6a9a';mm.fillRect(-96,-96,192,192);
  mm.fillStyle='#5a8a4a';mm.beginPath();mm.arc(0,0,WR*s,0,7);mm.fill();
  mm.fillStyle='#6a9a5a';mm.fillRect(-55*s,-55*s,110*s,110*s);
  if(gmode==='br'){mm.strokeStyle='#6b8dff';mm.lineWidth=2;mm.beginPath();mm.arc(Z.x*s,Z.z*s,Z.r*s,0,7);mm.stroke()}
  for(const k in P){const p=P[k];if(!p.al)continue;mm.fillStyle=p.bot?'#ff5a5a':(CH[p.c|0]?CH[p.c|0].c:'#ff8');mm.beginPath();mm.arc(p.x*s,p.z*s,3.2,0,7);mm.fill()}
  mm.translate(me.x*s,me.z*s);mm.rotate(-me.yaw);
  mm.fillStyle=CH[ch].c;mm.beginPath();mm.moveTo(0,-7);mm.lineTo(4,4);mm.lineTo(-4,4);mm.closePath();mm.fill();
  mm.restore();
}

function isAimingAtEnemy(){
  if(!mob)return false;
  const eyeY=me.crouch||me.slide?EYE*.68:EYE;
  const o={x:me.x,y:me.y+eyeY,z:me.z},f=fwd();
  let closest=null,closestT=W[me.sl[me.cs]]?.rg||150;
  for(const k in P){
    const p=P[k];
    if(!p.al)continue;
    if(gmode==='tdm'&&(p.team|0)===me.team)continue;
    const h=rp(o,f,p,closestT);
    if(h&&h[0]<closestT){closestT=h[0];closest=k}
  }
  if(!closest)return false;
  const t=ray(o,f,closestT+0.5);
  return t>=closestT-0.6;
}

function frame(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;const tm=n/1000;
  if(live){upd(dt);const t=nowT(),Z=zone(t);let tg=me;if(!me.al)tg=Object.values(P).find(p=>p.al)||me;
    const eyeH=(me.al&&(me.crouch||me.slide))?EYE*.68:EYE;
    if(me.al||tg==me){cam.position.set(me.x,me.y+eyeH+Math.sin(me.ph*2)*.015,me.z);cam.rotation.set(me.pitch,me.yaw,me.slide*.08,'YXZ')}
    else{cam.position.set(tg.x,tg.y+EYE,tg.z);cam.rotation.set(tg.pitch||0,tg.yaw||0,0,'YXZ')}
    vm.position.z=-.42+me.kick*.06;vm.position.y=-.2-Math.sin(me.ph*2)*.005+(me.rl>0?-.07:0)+(me.crouch||me.slide?.04:0);vm.rotation.x=me.kick*.04;fl.visible=(flT-=dt)>0;vm.visible=me.al&&live==1&&!knifeMode;knifeSwingAnim(dt);
    if(me.al)minimap(Z);
    for(const k in P){const p=P[k];if(p.tx==null)continue;let m=PM[k];if(!m){m=PM[k]=soldier(p.c|0);scene.add(m)}m.visible=p.al!==0;if(!m.visible){if(NT[k])NT[k].style.display='none';continue}
      m.position.set(p.x,p.y,p.z);m.rotation.y=p.yaw;const sw=Math.sin(p.ph)*.55;m.l1.rotation.x=sw;m.l2.rotation.x=-sw;
      V.set(p.x,p.y+2.1,p.z).project(cam);let el=NT[k]||(NT[k]=Object.assign(document.createElement('div'),{className:'nt'}));if(!el.parentNode)nts.appendChild(el);
      const d=H(p.x-cam.position.x,p.z-cam.position.z);if(V.z<1&&d<85&&me.al&&!p.bot){el.style.display='block';el.style.left=(V.x*.5+.5)*innerWidth+'px';el.style.top=(-V.y*.5+.5)*innerHeight+'px';el.innerHTML=`<span style="color:${CH[p.c|0].c}">${esc((Pi[k]||{}).n||'')}</span> <i style="font-style:normal;color:#ff6a4a">${p.hp|0}</i>`}else el.style.display='none'}
    for(const o of LT)if(o.m.visible){o.m.rotation.y=tm*1.5;o.m.position.y=o.y+Math.sin(tm*2.4+o.id)*.07}
    
    if(mob&&me.al&&live==1&&fire===0){
      const id=me.sl[me.cs];
      if(id>=0&&me.swT<=0&&me.cd<=0&&me.rl<=0&&me.mg[me.cs]>0&&!me.use){
        if(isAimingAtEnemy()){
          const w=W[id];
          if(w.au||!held){shoot();held=1}
        }
      }
    }
    if(mob&&me.al&&live==1){
      $('xh').classList.toggle('auto',isAimingAtEnemy());
    }else{
      $('xh').classList.remove('auto');
    }
  }else{const a=tm*.04;cam.position.set(Math.cos(a)*85,32+Math.sin(tm*.14)*5,Math.sin(a)*85);cam.lookAt(0,3,0);vm.visible=false;if($('m').classList.contains('on'))cards(tm);for(const k in NT)NT[k].style.display='none'}
  ren.render(scene,cam);requestAnimationFrame(frame);
}

let dip=null,std=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent||'');
const ibs=()=>document.querySelectorAll('.ib').forEach(b=>b.style.display=!std&&(dip||ios)?'':'none');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;ibs()});
addEventListener('appinstalled',()=>{dip=null;std=true;ibs()});
document.querySelectorAll('.ib').forEach(b=>b.onclick=async()=>{if(dip){dip.prompt();try{await dip.userChoice}catch(e){}dip=null;ibs()}else if(ios)ov('Install','Safari → Share → Add to Home Screen',[['OK',()=>scr(uid?'m':'a'),'p']])});
ibs();gen(777,0);

setTimeout(()=>{const l=$('loading');if(l)l.style.display='none';const f=$('ldbFill');if(f)f.style.width='100%'},100);
requestAnimationFrame(frame);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
