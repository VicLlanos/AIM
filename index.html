<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Emberfall – First Person</title>
<meta name="theme-color" content="#0b0807">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0807;color:#efe4d0;font:15px/1.5 system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.sc{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:radial-gradient(ellipse at 50% 40%,rgba(20,12,8,.92) 0,rgba(11,8,7,.7) 70%,#0b0807 100%);text-align:center;z-index:10}
.sc.on{display:flex}
h1,h2{font:400 clamp(40px,11vw,84px)/1 'Pirata One',Georgia,serif;color:#ffb35c;letter-spacing:.04em;text-shadow:0 0 40px #ff7a2f66}
h2{font-size:clamp(28px,7vw,46px)}
.t{max-width:46ch;color:#d9c9ae;line-height:1.55}
.m{color:#ff9d6b;min-height:1.4em;font-size:14px}
button,input{font:inherit;padding:.65em 1.2em;border-radius:8px;border:2px solid #5a3a22;background:#241a14;color:#efe4d0}
button{cursor:pointer;font-weight:700}
button.p{background:linear-gradient(180deg,#ff9d4a,#e8561a);border-color:#ffb35c;color:#1a0d04;box-shadow:0 4px 0 #8a2f0c,0 0 24px #ff7a2f55}
button.p:active{transform:translateY(3px);box-shadow:0 1px 0 #8a2f0c}
button.l{background:none;border:0;text-decoration:underline;font-weight:400;opacity:.85}
input{width:13em;text-align:center;user-select:text;background:#1a120e}
#jc{width:6.5em;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.r{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cd{width:150px;padding:10px 8px;border-radius:10px;border:2px solid #3a2a1c;background:linear-gradient(180deg,#2c2018,#1a120d);cursor:pointer;transition:transform .15s,box-shadow .15s}
.cd b{display:block;font-size:15px;margin:.3em 0 .1em}
.cd.on{border-color:var(--c);box-shadow:0 0 24px var(--c)}
.cd:hover{transform:translateY(-4px)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #efe4d0aa;border-radius:50%}
#cross::before,#cross::after{content:'';position:absolute;background:#efe4d0aa}
#cross::before{left:50%;top:3px;width:2px;height:12px;margin-left:-1px}
#cross::after{top:50%;left:3px;height:2px;width:12px;margin-top:-1px}
#hpbar{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:min(320px,80vw);height:14px;background:#000a;border:2px solid #3a2a1c;border-radius:4px;overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ff9d4a,#e8561a);transition:width .1s}
#shfill{position:absolute;top:0;left:0;height:5px;background:#8fd6ff;width:0}
#info{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:14px;text-shadow:0 1px 4px #000}
#weapon{position:absolute;bottom:52px;right:18px;text-align:right;font-size:14px;text-shadow:0 1px 4px #000}
#killfeed{position:absolute;bottom:90px;left:16px;font-size:13px}
#cap{position:absolute;top:18%;left:0;right:0;text-align:center;font:26px 'Pirata One',Georgia,serif;color:#ffb35c;text-shadow:0 0 20px #ff7a2f88;opacity:0;transition:opacity .3s}
#lockmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0008;font-size:18px;z-index:6;cursor:pointer}
#lockmsg span{background:#1a120e;padding:16px 28px;border-radius:10px;border:2px solid #5a3a22}
#tb{position:fixed;right:14px;bottom:90px;display:none;flex-direction:column;gap:10px;z-index:8}
@media(pointer:coarse){#tb{display:flex}}
#tb button{width:56px;height:56px;border-radius:50%;padding:0;font-size:12px;font-weight:700;background:#241a14;border:2px solid #5a3a22;color:#efe4d0;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="cross"></div>
  <div id="hpbar"><div id="shfill"></div><div id="hpfill"></div></div>
  <div id="info"></div>
  <div id="weapon"></div>
  <div id="killfeed"></div>
  <div id="cap"></div>
  <div id="lockmsg"><span>Click to enter the vigil</span></div>
</div>
<div id="tb">
  <button id="bj">Jump</button>
  <button id="bd">Dash</button>

</div>

<div class="sc on" id="a">
  <h1>Emberfall</h1>
  <p class="t" id="at">Log in to join the last vigil of Ashmere.</p>
  <input id="au" placeholder="Username" autocomplete="username">
  <input id="ap" type="password" placeholder="Password" autocomplete="current-password">
  <button class="p" id="ag">Log in</button>
  <button class="l" id="as">New here? Create account</button>
  <p class="m" id="ae"></p>
</div>

<div class="sc" id="m">
  <h1>Emberfall</h1>
  <p class="t">The Hollow Sun is closing over Ashmere. Twelve Wardens, one Forge, one flame. Loot the ruins, outlast the dark, and be the last ember burning.</p>
  <p id="hi"></p>
  <div class="r" id="cl"></div>
  <div class="r">

    <input id="jc" maxlength="4" placeholder="CODE">
    <button id="jn">Join</button>
  </div>
  <button class="l" id="so">Sign out</button>
  <p class="m" id="mg"></p>
</div>

<div class="sc" id="l">
  <h2>Room <span id="rc"></span></h2>
  <p class="t">Share this code. Up to twelve Wardens may enter.</p>
  <div class="r" id="pl"></div>
  <div class="r">
    <button class="p" id="go">Begin the vigil</button>
    <button id="lv">Leave</button>
  </div>
</div>

<div class="sc" id="o"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* ========== SAME FIREBASE PROJECT ========== */
firebase.initializeApp({
  apiKey:"AIzaSyCVHGzqZvQLbNbm42l94_qRa1i_EacGu18",
  authDomain:"aimit-9449f.firebaseapp.com",
  databaseURL:"https://aimit-9449f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"aimit-9449f",
  storageBucket:"aimit-9449f.firebasestorage.app",
  messagingSenderId:"1065463623353",
  appId:"1:1065463623353:web:46862214f956fb72487568"
});
const db = firebase.database(), auth = firebase.auth();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#'+c.charCodeAt(0)+';');
const R = Math.random, H = Math.hypot, T2 = Math.PI*2;

/* ========== DESIGN DATA (same names / colors) ========== */
const CH = [
  {n:'Ember Knight', c:'#e8692a', d:'#7a2a0c', b:'Horned helm, iron will.'},
  {n:'Hollow Hunter', c:'#2fb89a', d:'#12594b', b:'Feathered hood, quiet step.'},
  {n:'Ash Mage', c:'#9a6bff', d:'#43238a', b:'Pointed hat, restless sparks.'},
  {n:'Forge Smith', c:'#e8b93a', d:'#7a5a10', b:'Visored helm, heavy hands.'}
];
const W = [
  {n:'Sparkcaster', d:14, r:0.38, v:70, l:0.9, q:1, sp:0.04, c:'#ffd27a'},
  {n:'Cinder Spitter', d:7, r:0.09, v:64, l:0.7, q:1, sp:0.13, c:'#ff8a3d'},
  {n:'Dawnbreaker', d:7, r:0.85, v:56, l:0.42, q:7, sp:0.3, c:'#ff5a3a'},
  {n:'Lance of Sol', d:38, r:0.75, v:110, l:1.2, q:1, sp:0.01, c:'#fff1b8'}
];
const RAR = ['Worn','Tempered','Radiant'], RC = ['#b9a98e','#6fd0ff','#ffd24a'];
const WS = 400, HOLD = 45, SHR = 30; // world half-size ~400 units
const ZR = [290,170,100,55,25,8];
const LORE = [
  'The bells of Ashmere ring. The Hollow light begins to close.',
  'Orrin’s shard hums: the sun feeds on what is hoarded.',
  'The Choir sings from the dark. Do not listen.',
  'Only the strongest ember survives the dusk.',
  'One Warden will carry the flame to the Forge.'
];

/* ========== STATE ========== */
let uid, uname='', pend='', ch=0, wins=0, signup=0, rf, host=0, live=0, off=0, t0=0, seed=0;
let Pi={}, startN=1, kills=0, done=0, cap='', capT=0;
let keys={}, fire=0, dreq=0, hreq=0, jreq=0, fd=[];
const me = {x:0,y:1.7,z:0, yaw:0, pitch:0, hp:100, sh:0, al:1, w:0, q:0, cd:0, dc:0, inv:0, hb:1, vx:0, vz:0, onGround:true};
const P = {}, TK = {};
let scene, camera, renderer, controls, clock, ground, objects=[], husks=[], bullets=[], particles=[];
let zoneMesh, zoneCenter = new THREE.Vector3(), zoneR = 290;
let ambientEmbers = [];

const scr = i => {['a','m','l','o'].forEach(k => $(k).classList.toggle('on', k===i)); $('hud').style.display = (i===''?'block':'none');};
const msg = (t,e='mg') => $(e).textContent = t||'';
db.ref('.info/serverTimeOffset').on('value', s => off = s.val()||0);

/* ========== AUTH / MENUS (same flow) ========== */
auth.onAuthStateChanged(async u => {
  if(u){
    uid = u.uid; uname = u.displayName || pend || 'Warden';
    try{const d=(await db.ref('users/'+uid).once('value')).val(); if(d){ch=d.ch|0; wins=d.w|0;}}catch(e){}
    $('hi').textContent = `Hi, ${uname}.  Victories: ${wins}`;
    pick(ch,1); scr('m');
  } else { bye(); scr('a'); }
});
$('as').onclick = () => {
  signup = !signup;
  $('at').textContent = signup ? 'Create your account' : 'Log in to join the last vigil of Ashmere.';
  $('ag').textContent = signup ? 'Sign up' : 'Log in';
  $('as').textContent = signup ? 'Have an account? Log in' : 'New here? Create account';
  msg('','ae');
};
$('ag').onclick = async () => {
  const e = t => msg(t,'ae'), u = $('au').value.trim(), p = $('ap').value; e('');
  if(!/^[a-zA-Z0-9_]{3,16}$/.test(u)) return e('Username: 3–16 letters, numbers or _');
  if(p.length < 6) return e('Password needs 6+ characters');
  $('ag').disabled = true;
  const mail = u.toLowerCase()+'@aimit.local';
  try{
    if(signup){
      pend = u;
      const c = await auth.createUserWithEmailAndPassword(mail,p);
      await c.user.updateProfile({displayName:u});
      uname = u;
      await db.ref('users/'+c.user.uid).set({name:u, ch:0, w:0});
    } else await auth.signInWithEmailAndPassword(mail,p);
  }catch(x){
    const m = x.code||x.message||'';
    e(/email-already/.test(m)?'Username already taken':
      /invalid-credential|user-not-found|wrong-password/.test(m)?'Wrong username or password':
      /operation-not-allowed/.test(m)?'Enable Email/Password sign-in in Firebase Console':
      /permission/i.test(m)?'Database rules block this': m.replace('Firebase: ',''));
  }
  $('ag').disabled = false;
};
$('so').onclick = () => { bye(); auth.signOut(); };

$('cl').innerHTML = CH.map((c,i)=>`<button class="cd" data-i="${i}" style="--c:${c.c}"><b style="color:${c.c}">${c.n}</b>${c.b}</button>`).join('');
function pick(i,q){ ch=i; [...$('cl').children].forEach((b,j)=>b.classList.toggle('on',j===i)); if(!q&&uid) db.ref('users/'+uid).update({ch:i}).catch(()=>{}); }
$('cl').onclick = e => { const b=e.target.closest('button'); if(b) pick(+b.dataset.i); };

async function enter(c,h){
  rf = db.ref('rooms/'+c); host = h;
  const mp = rf.child('p/'+uid);
  await mp.set({n:uname, c:ch});
  mp.onDisconnect().remove();
  if(h) rf.onDisconnect().remove();
  rf.child('p').on('value', s => {
    Pi = s.val()||{};
    $('pl').innerHTML = Object.values(Pi).map(p=>`<div class="cd" style="border:2px solid ${CH[p.c].c}"><b>${esc(p.n)}</b>${CH[p.c].n}</div>`).join('');
    $('go').style.display = host ? '' : 'none';
  });
  rf.child('status').on('value', s => {
    const v = s.val();
    if(v==='play' && !live && !done) rf.once('value').then(x => begin(x.val()));
    else if(v===null && (live||done)) bye('The host left the vigil.');
  });
  const sf = s => {
    if(s.key===uid || !s.val()) return;
    const a = s.val().split(',');
    let p = P[s.key];
    if(!p){
      p = P[s.key] = {mesh:null, x:+a[0], y:+a[1], z:+a[2], yaw:+a[3], hp:+a[4], sh:+a[5], c:+a[6], w:+a[7], al:+a[8], k:+a[9]};
      p.mesh = makePlayerMesh(p.c);
      scene.add(p.mesh);
    }
    p.tx=+a[0]; p.ty=+a[1]; p.tz=+a[2]; p.yaw=+a[3]; p.hp=+a[4]; p.sh=+a[5]; p.c=+a[6]; p.w=+a[7]; p.al=+a[8]; p.k=+a[9];
  };
  rf.child('s').on('child_added', sf);
  rf.child('s').on('child_changed', sf);
  rf.child('s').on('child_removed', s => {
    if(P[s.key]?.mesh) scene.remove(P[s.key].mesh);
    delete P[s.key];
  });
  rf.child('ev').on('child_added', s => onEv(s.val()));
  rf.child('l').on('child_added', s => TK[s.key]=1);
  $('rc').textContent = c; scr('l');
}
$('mk').onclick = async () => {
  const c = Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[R()*24|0]).join('');
  try{ await enter(c,1); await rf.update({status:'lobby', t:Date.now()}); }catch(e){ msg('Could not create room: '+e.message); }
};
$('jn').onclick = async () => {
  const c = $('jc').value.trim().toUpperCase();
  if(c.length!==4) return msg('Enter the 4-letter code.');
  try{
    const d = (await db.ref('rooms/'+c).once('value')).val();
    if(!d) return msg('Room not found.');
    if(d.status!=='lobby') return msg('That vigil has already begun.');
    if(Object.keys(d.p||{}).length>=12) return msg('Room is full.');
    await enter(c,0);
  }catch(e){ msg('Join failed: '+e.message); }
};
$('go').onclick = () => rf.update({seed: (Date.now()%1e6)|0, t0:Date.now()+off+4000, status:'play'});
$('lv').onclick = () => bye();
function bye(t){
  live=done=0;
  if(rf){ rf.off(); rf.child('p/'+uid).remove(); rf.child('s/'+uid).remove(); if(host) rf.remove(); rf=null; }
  host=0; for(const k in P){ if(P[k].mesh) scene?.remove(P[k].mesh); delete P[k]; }
  Pi={}; if(uid) scr('m'); msg(t);
  if(controls) controls.unlock();
}
function ov(t,x,b){
  $('o').innerHTML = `<h2>${t}</h2><p class="t">${x}</p><div class="r" id="ob"></div>`;
  b.forEach(a=>{ const e=document.createElement('button'); e.className=a[2]||''; e.textContent=a[0]; e.onclick=a[1]; $('ob').appendChild(e); });
  scr('o');
}

/* ========== 3D WORLD + CHARACTERS ========== */
function makePlayerMesh(ci){
  const g = new THREE.Group();
  const col = new THREE.Color(CH[ci].c);
  const dark = new THREE.Color(CH[ci].d);
  // body
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35,0.9,4,8), new THREE.MeshStandardMaterial({color:col, roughness:0.7}));
  body.position.y = 0.9; g.add(body);
  // head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28,8,6), new THREE.MeshStandardMaterial({color:0xe8c9a0, roughness:0.6}));
  head.position.y = 1.7; g.add(head);
  // simple class accent
  if(ci===0){ // horns
    const hornMat = new THREE.MeshStandardMaterial({color:0x9aa3b2});
    const h1 = new THREE.Mesh(new THREE.ConeGeometry(0.08,0.4,5), hornMat); h1.position.set(-0.18,1.95,0); h1.rotation.z=0.4; g.add(h1);
    const h2 = h1.clone(); h2.position.x=0.18; h2.rotation.z=-0.4; g.add(h2);
  } else if(ci===2){ // hat
    const hat = new THREE.Mesh(new THREE.ConeGeometry(0.4,0.7,8), new THREE.MeshStandardMaterial({color:dark}));
    hat.position.y = 2.05; g.add(hat);
  }
  // cape
  const cape = new THREE.Mesh(new THREE.PlaneGeometry(0.7,1.1), new THREE.MeshStandardMaterial({color:dark, side:THREE.DoubleSide, roughness:0.9}));
  cape.position.set(0,1.1,-0.35); g.add(cape);
  g.userData = {body, head};
  return g;
}

function makeTree(x,z){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.35,2.2,6), new THREE.MeshStandardMaterial({color:0x4a3020}));
  trunk.position.y = 1.1; g.add(trunk);
  const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.4,7,5), new THREE.MeshStandardMaterial({color:0x1f3a22, roughness:0.9}));
  leaves.position.y = 2.8; g.add(leaves);
  g.position.set(x,0,z);
  g.userData = {type:'tree', r:0.6, h:3.5};
  return g;
}
function makeRock(x,z,s=1){
  const mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.9*s,0), new THREE.MeshStandardMaterial({color:0x6b6660, roughness:0.85}));
  mesh.position.set(x,0.5*s,z); mesh.rotation.set(R()*2,R()*2,R()*2);
  mesh.userData = {type:'rock', r:0.9*s, h:1.2*s};
  return mesh;
}
function makeBuilding(x,z,w,d,h){
  const g = new THREE.Group();
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color:0x4a3626, roughness:0.8}));
  wall.position.y = h/2; g.add(wall);
  // simple roof
  const roof = new THREE.Mesh(new THREE.BoxGeometry(w+0.4,0.3,d+0.4), new THREE.MeshStandardMaterial({color:0x3a2a1c}));
  roof.position.y = h+0.15; g.add(roof);
  g.position.set(x,0,z);
  g.userData = {type:'building', w, d, h};
  return g;
}
function makeLoot(x,z,k,q,id){
  const col = k<4 ? RC[q] : (k===4 ? 0x7dffa8 : 0x8fd6ff);
  const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.35,0), new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:0.6, roughness:0.3}));
  mesh.position.set(x,0.6,z);
  mesh.userData = {type:'loot', k, q, id};
  return mesh;
}

function genWorld(sd){
  // clear old
  objects.forEach(o => scene.remove(o));
  objects = []; husks = []; bullets = []; particles = [];
  const rng = (() => { let s = sd|0; return () => { s = s+0x6D2B79F5|0; let t = Math.imul(s^s>>>15,1|s); t = t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; })();

  // ground
  const groundGeo = new THREE.PlaneGeometry(WS*2+40, WS*2+40, 64, 64);
  const pos = groundGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getY(i);
    let h = Math.sin(x*0.03)*Math.cos(z*0.025)*4 + Math.sin(x*0.08+z*0.06)*1.5;
    // gentle hills
    pos.setZ(i, h);
  }
  groundGeo.computeVertexNormals();
  ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({color:0x2a1d15, roughness:0.95, flatShading:false}));
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  // buildings + loot
  let id = 1;
  for(let i=0;i<18;i++){
    const w = 8+rng()*10, d = 7+rng()*8, h = 4+rng()*5;
    const x = (rng()-0.5)*(WS*1.6), z = (rng()-0.5)*(WS*1.6);
    const b = makeBuilding(x,z,w,d,h);
    scene.add(b); objects.push(b);
    for(let j=0;j<3;j++){
      const lx = x+(rng()-0.5)*w*0.7, lz = z+(rng()-0.5)*d*0.7;
      const k = rng()<0.45 ? (rng()*4|0) : (rng()<0.75?4:5);
      const q = rng()<0.12?2:rng()<0.4?1:0;
      const loot = makeLoot(lx,lz,k,q,id++);
      scene.add(loot); objects.push(loot);
    }
  }
  // trees
  for(let i=0;i<120;i++){
    const x=(rng()-0.5)*WS*1.9, z=(rng()-0.5)*WS*1.9;
    if(Math.abs(x)<15&&Math.abs(z)<15) continue;
    const t = makeTree(x,z); scene.add(t); objects.push(t);
  }
  // rocks
  for(let i=0;i<60;i++){
    const x=(rng()-0.5)*WS*1.9, z=(rng()-0.5)*WS*1.9;
    const r = makeRock(x,z,0.7+rng()*1.2); scene.add(r); objects.push(r);
  }
  // scattered loot
  for(let i=0;i<40;i++){
    const x=(rng()-0.5)*WS*1.7, z=(rng()-0.5)*WS*1.7;
    const k = rng()<0.45?(rng()*4|0):(rng()<0.75?4:5);
    const q = rng()<0.12?2:rng()<0.4?1:0;
    const loot = makeLoot(x,z,k,q,id++); scene.add(loot); objects.push(loot);
  }
  // zone path (same logic scaled)
  const ZC = [[0,0]];
  for(let i=1;i<6;i++){
    const [px,pz]=ZC[i-1], a=rng()*T2, d=rng()*(ZR[i-1]-ZR[i]);
    ZC.push([Math.max(-WS+ZR[i],Math.min(WS-ZR[i],px+Math.cos(a)*d)), Math.max(-WS+ZR[i],Math.min(WS-ZR[i],pz+Math.sin(a)*d))]);
  }
  window._ZC = ZC;
  return id;
}

function zone(t){
  const ZC = window._ZC || [[0,0]];
  let i = Math.min(4, Math.max(0, t<0?0:Math.floor(t/(HOLD+SHR))));
  let l = t - i*(HOLD+SHR);
  let f = l>HOLD ? Math.min(1,(l-HOLD)/SHR) : 0;
  if(t >= 5*(HOLD+SHR)){ i=4; f=1; }
  const a = ZC[i], b = ZC[i+1]||a;
  return {
    x: a[0]+(b[0]-a[0])*f,
    z: a[1]+(b[1]-a[1])*f,
    r: ZR[i]+(ZR[i+1]-ZR[i])*f,
    i, f, left: f?0:HOLD-l
  };
}

/* ========== GAME START ========== */
function begin(d){
  if(!d || live) return;
  seed = d.seed; t0 = d.t0;
  // init Three.js if needed
  if(!scene) initThree();
  genWorld(seed);
  const ids = Object.keys(d.p).sort();
  const i = ids.indexOf(uid);
  const a = i * T2 / ids.length + (seed%100)/16;
  startN = ids.length;
  Object.assign(me, {
    x: Math.cos(a)*140, y: 8, z: Math.sin(a)*140,
    yaw: a+Math.PI, pitch:0, hp:100, sh:0, al:1, w:0, q:0, hb:1, cd:0, dc:0, inv:0, vx:0, vz:0, onGround:false
  });
  camera.position.set(me.x, me.y, me.z);
  kills=0; done=0; fd=[]; TK={};
  live=1; scr('');
  cap = LORE[0]; capT = 6;
  $('lockmsg').style.display = 'flex';
  controls.lock();
}

function initThree(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0807);
  scene.fog = new THREE.FogExp2(0x0b0807, 0.0045);

  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 600);
  camera.position.set(0,1.7,0);

  renderer = new THREE.WebGLRenderer({canvas:$('c'), antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  // lights
  const amb = new THREE.AmbientLight(0x3a2a20, 0.55);
  scene.add(amb);
  const sun = new THREE.DirectionalLight(0xffb07a, 1.1);
  sun.position.set(40,80,30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near = 10; sun.shadow.camera.far = 300;
  sun.shadow.camera.left = sun.shadow.camera.bottom = -120;
  sun.shadow.camera.right = sun.shadow.camera.top = 120;
  scene.add(sun);
  // subtle fill
  const fill = new THREE.DirectionalLight(0x6a5a9a, 0.25);
  fill.position.set(-30,40,-40);
  scene.add(fill);

  // zone ring (visual)
  const zoneGeo = new THREE.RingGeometry(1,1.02,64);
  const zoneMat = new THREE.MeshBasicMaterial({color:0xb48cff, side:THREE.DoubleSide, transparent:true, opacity:0.55});
  zoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
  zoneMesh.rotation.x = -Math.PI/2;
  zoneMesh.position.y = 0.15;
  scene.add(zoneMesh);

  // ambient floating embers
  for(let i=0;i<80;i++){
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.06+R()*0.08,4,4), new THREE.MeshBasicMaterial({color:0xff9d4a, transparent:true, opacity:0.7}));
    e.position.set((R()-0.5)*WS*1.8, 2+R()*18, (R()-0.5)*WS*1.8);
    e.userData = {vy:0.3+R()*0.8, life:2+R()*4};
    scene.add(e); ambientEmbers.push(e);
  }

  controls = new PointerLockControls(camera, document.body);
  controls.addEventListener('lock', () => { $('lockmsg').style.display='none'; });
  controls.addEventListener('unlock', () => { if(live&&me.al) $('lockmsg').style.display='flex'; });
  $('lockmsg').onclick = () => controls.lock();

  clock = new THREE.Clock();
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // input
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    keys[k] = 1;
    if(k===' ') { jreq=1; e.preventDefault(); }
    if(k==='shift') dreq=1;
    if(k==='f') hreq=1;
  });
  addEventListener('keyup', e => keys[e.key.toLowerCase()]=0);
  addEventListener('mousedown', e => { if(e.button===0) fire=1; });
  addEventListener('mouseup', e => { if(e.button===0) fire=0; });
  $('bj').onpointerdown = () => jreq=1;
  $('bd').onpointerdown = () => dreq=1;
  $('bh').onpointerdown = () => hreq=1;

  animate();
}

/* ========== PHYSICS / INTERACTION ========== */
function getGroundHeight(x,z){
  // approximate the same formula used for the plane
  return Math.sin(x*0.03)*Math.cos(z*0.025)*4 + Math.sin(x*0.08+z*0.06)*1.5 + 0.05;
}

function collide(x,y,z, rad=0.4){
  // simple AABB / cylinder checks against objects
  for(const o of objects){
    const ud = o.userData;
    if(ud.type==='tree'){
      const dx=x-o.position.x, dz=z-o.position.z;
      if(H(dx,dz) < ud.r+rad && y < ud.h) return true;
    } else if(ud.type==='rock'){
      const dx=x-o.position.x, dy=y-o.position.y, dz=z-o.position.z;
      if(H(dx,dy,dz) < ud.r+rad) return true;
    } else if(ud.type==='building'){
      const hw=ud.w/2+rad, hd=ud.d/2+rad;
      if(Math.abs(x-o.position.x)<hw && Math.abs(z-o.position.z)<hd && y < ud.h+0.5) return true;
    }
  }
  return false;
}

function tryMove(dx,dz,dt){
  const speed = me.dd > 0 ? 28 : 11;
  let nx = me.x + dx * speed * dt;
  let nz = me.z + dz * speed * dt;
  // world bounds
  nx = Math.max(-WS, Math.min(WS, nx));
  nz = Math.max(-WS, Math.min(WS, nz));
  // collision
  if(!collide(nx, me.y, me.z)) me.x = nx;
  if(!collide(me.x, me.y, nz)) me.z = nz;
}

function updatePlayer(dt){
  if(!me.al || !live) return;
  const t = (Date.now()+off-t0)/1000;
  const Z = zone(t);

  // look
  me.yaw = controls.getObject().rotation.y;
  me.pitch = camera.rotation.x;

  // movement
  let ax=0, az=0;
  if(keys.w||keys.arrowup) az-=1;
  if(keys.s||keys.arrowdown) az+=1;
  if(keys.a||keys.arrowleft) ax-=1;
  if(keys.d||keys.arrowright) ax+=1;
  const len = H(ax,az);
  if(len>1){ ax/=len; az/=len; }

  // transform by yaw
  const sin = Math.sin(me.yaw), cos = Math.cos(me.yaw);
  const mx = ax*cos + az*sin;
  const mz = -ax*sin + az*cos;

  if(dreq && me.dc<=0){
    me.dd = 0.22; me.dc = 3.2; me.inv = 0.25;
  }
  if(me.dd>0) me.dd -= dt;

  tryMove(mx, mz, dt);

  // jump + gravity
  const gh = getGroundHeight(me.x, me.z);
  if(jreq && me.onGround){ me.vz = 9.5; me.onGround = false; }
  me.vz -= 22 * dt;
  me.y += me.vz * dt;
  if(me.y <= gh + 1.7){
    me.y = gh + 1.7;
    me.vz = 0;
    me.onGround = true;
  } else me.onGround = false;

  // vertical collision with objects (simple)
  if(collide(me.x, me.y-0.9, me.z, 0.35)){
    me.y += 0.15; me.vz = Math.max(0, me.vz);
  }

  // shoot
  if(fire && me.cd<=0) shoot();

  // heal
  if(hreq && me.hb>0 && me.hp<100){
    me.hb--; me.hp = Math.min(100, me.hp+45);
    spawnBurst(me.x, me.y, me.z, 0x7dffa8, 12);
  }

  // zone damage
  if(t>0 && H(me.x-Z.x, me.z-Z.z) > Z.r){
    me.hp -= (1.2 + Z.i*1.4) * dt;
    if(me.hp<=0){ me.hp=0; die(''); }
  }

  // loot pickup
  for(const o of objects){
    if(o.userData.type!=='loot' || TK[o.userData.id]) continue;
    if(H(me.x-o.position.x, me.z-o.position.z)<1.6 && Math.abs(me.y-o.position.y)<2){
      TK[o.userData.id]=1;
      rf.child('l/'+o.userData.id).set(uid);
      scene.remove(o);
      const k=o.userData.k, q=o.userData.q;
      if(k<4){ me.w=k; me.q=q; cap=RAR[q]+' '+W[k].n; capT=1.6; }
      else if(k===4){ me.hb=Math.min(3,me.hb+1); cap='Emberbloom'; capT=1.3; }
      else { me.sh=Math.min(100,me.sh+40+20*q); cap='Ashplate'; capT=1.3; }
    }
  }

  me.cd = Math.max(0, me.cd-dt);
  me.dc = Math.max(0, me.dc-dt);
  me.inv = Math.max(0, me.inv-dt);
  jreq=dreq=hreq=0;

  // apply to camera
  controls.getObject().position.set(me.x, me.y, me.z);

  // net sync
  if(!window._nt) window._nt=0;
  window._nt += dt;
  if(window._nt > 0.1){
    window._nt=0;
    rf.child('s/'+uid).set([
      me.x.toFixed(2), me.y.toFixed(2), me.z.toFixed(2),
      me.yaw.toFixed(3), me.hp|0, me.sh|0, ch, me.w, me.al, kills
    ].join(','));
  }

  // win check
  if(startN>1 && t>3 && me.al && !Object.values(P).some(p=>p.al)) win();
}

function shoot(){
  const S = W[me.w];
  me.cd = S.r * (1 - 0.08*me.q);
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const origin = camera.position.clone().add(dir.clone().multiplyScalar(0.8));
  for(let i=0;i<S.q;i++){
    const spread = (R()-0.5)*S.sp*2;
    const d = dir.clone();
    d.applyAxisAngle(new THREE.Vector3(0,1,0), spread);
    d.applyAxisAngle(new THREE.Vector3(1,0,0), (R()-0.5)*S.sp);
    bullets.push({
      pos: origin.clone(),
      vel: d.multiplyScalar(S.v),
      life: S.l,
      dmg: S.d*(1+0.25*me.q),
      color: S.c,
      from: uid
    });
  }
  // muzzle flash particle
  spawnBurst(origin.x, origin.y, origin.z, S.c, 4);
  // network event
  rf.child('ev').push({k:'b', u:uid, x:origin.x, y:origin.y, z:origin.z, dx:dir.x, dy:dir.y, dz:dir.z, w:me.w, q:me.q});
}

function onEv(o){
  if(!live) return;
  if(o.k==='b' && o.u!==uid){
    const origin = new THREE.Vector3(o.x,o.y,o.z);
    const dir = new THREE.Vector3(o.dx,o.dy,o.dz).normalize();
    const S = W[o.w||0];
    for(let i=0;i<S.q;i++){
      bullets.push({
        pos: origin.clone(),
        vel: dir.clone().multiplyScalar(S.v),
        life: S.l,
        dmg: S.d*(1+0.25*(o.q||0)),
        color: S.c,
        from: o.u
      });
    }
  } else if(o.k==='x'){
    const a = o.u===uid ? 'You' : (Pi[o.u]||{}).n || '?';
    const v = o.v===uid ? 'you' : (Pi[o.v]||{}).n || '?';
    fd.push({t:`${a} ✦ ${v}`, l:5});
    if(o.u===uid && o.v!==uid){ kills++; spawnBurst(me.x,me.y,me.z,0xffd27a,8); }
  }
}

function die(by){
  me.al = 0;
  const rank = Object.values(P).filter(p=>p.al).length + 1;
  spawnBurst(me.x, me.y, me.z, CH[ch].c, 24);
  if(rf) rf.child('ev').push({k:'x', v:uid, u:by||''});
  controls.unlock();
  ov('Fallen', `Rank #${rank} of ${startN}. Kills: ${kills}. Your ember joins the Hollow.`, [
    ['Watch on', () => { scr(''); }],
    ['Menu', () => bye(), 'p']
  ]);
}
function win(){
  if(done) return;
  done=1; live=2; wins++;
  db.ref('users/'+uid+'/w').set(wins).catch(()=>{});
  controls.unlock();
  ov('Dawn', `You press the ember into the Forge. Light pours over Ashmere. Kills: ${kills}.`, [
    ['Menu', () => bye(), 'p']
  ]);
}

function spawnBurst(x,y,z,col,n){
  for(let i=0;i<n;i++){
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.08,4,4), new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:0.9}));
    p.position.set(x,y,z);
    p.userData = {vx:(R()-0.5)*8, vy:R()*6, vz:(R()-0.5)*8, life:0.4+R()*0.5};
    scene.add(p); particles.push(p);
  }
}

/* ========== MAIN LOOP ========== */
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = live ? (Date.now()+off-t0)/1000 : 0;

  if(live){
    updatePlayer(dt);

    // other players interpolation
    for(const k in P){
      const p = P[k];
      if(!p.mesh) continue;
      p.x += ((p.tx||p.x)-p.x)*Math.min(1,dt*12);
      p.y += ((p.ty||p.y)-p.y)*Math.min(1,dt*12);
      p.z += ((p.tz||p.z)-p.z)*Math.min(1,dt*12);
      p.mesh.position.set(p.x, p.y-1.7, p.z);
      p.mesh.rotation.y = p.yaw || 0;
      p.mesh.visible = !!p.al;
    }

    // bullets
    for(let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      b.pos.addScaledVector(b.vel, dt);
      b.life -= dt;
      // simple hit vs local player
      if(b.from!==uid && me.al && b.pos.distanceTo(camera.position)<1.1){
        if(me.inv<=0){
          const absorb = Math.min(me.sh, b.dmg);
          me.sh -= absorb; me.hp -= (b.dmg-absorb);
          me.inv = 0.15;
          if(me.hp<=0){ me.hp=0; die(b.from); }
        }
        b.life = 0;
      }
      // hit other players (client prediction only for feedback)
      for(const k in P){
        const p = P[k];
        if(!p.al || b.from===k) continue;
        if(b.pos.distanceTo(new THREE.Vector3(p.x,p.y,p.z))<1.2){
          spawnBurst(b.pos.x,b.pos.y,b.pos.z,0xff8866,5);
          b.life = 0; break;
        }
      }
      if(b.life<=0 || b.pos.y<0) bullets.splice(i,1);
    }

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.position.x += p.userData.vx*dt;
      p.position.y += p.userData.vy*dt;
      p.position.z += p.userData.vz*dt;
      p.userData.vy -= 12*dt;
      p.userData.life -= dt;
      p.material.opacity = Math.max(0, p.userData.life*2);
      if(p.userData.life<=0){ scene.remove(p); particles.splice(i,1); }
    }

    // ambient embers
    for(const e of ambientEmbers){
      e.position.y += e.userData.vy*dt;
      e.userData.life -= dt;
      if(e.userData.life<=0 || e.position.y>25){
        e.position.set((R()-0.5)*WS*1.8, 1+R()*3, (R()-0.5)*WS*1.8);
        e.userData.life = 2+R()*5;
      }
    }

    // zone visual
    const Z = zone(t);
    zoneCenter.set(Z.x, 0, Z.z);
    zoneMesh.position.x = Z.x; zoneMesh.position.z = Z.z;
    zoneMesh.scale.set(Z.r, Z.r, 1);
    zoneR = Z.r;

    // HUD
    $('hpfill').style.width = (me.hp)+'%';
    $('shfill').style.width = (me.sh)+'%';
    const al = Object.values(P).filter(p=>p.al).length + (me.al?1:0);
    $('info').textContent = t<0 ? `Gathering… ${Math.ceil(-t)}` : `Alive ${al}   ✦ ${kills}   ·   ${Z.f?'Hollow closing':'Closes in '+Math.ceil(Z.left)+'s'}`;
    $('weapon').innerHTML = `<span style="color:${RC[me.q]}">${RAR[me.q]} ${W[me.w].n}</span><br>Emberbloom ×${me.hb} [F]<br>${me.dc<=0?'Dash ready [Shift]':'Dash…'}`;
    $('killfeed').innerHTML = fd.map(f=>`<div style="opacity:${Math.min(1,f.l)}">${f.t}</div>`).join('');
    fd.forEach(f=>f.l-=dt); while(fd.length && fd[0].l<=0) fd.shift();
    if(capT>0){ capT-=dt; $('cap').textContent=cap; $('cap').style.opacity=Math.min(1,capT); } else $('cap').style.opacity=0;

    // lore triggers
    if(LORE[Z.i] && Z.left>HOLD-3 && capT<=0 && t>0 && (Z.i>0||t>8)){ cap=LORE[Z.i]; capT=5; }
  }

  if(renderer) renderer.render(scene, camera);
}

// start menu demo is not needed in FPS; just show menu
</script>
