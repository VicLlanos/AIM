<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0d081c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aimit">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Aimit — Archer Duel</title>
  <style>
    /* ========== GLOBAL RESET & BASE ========== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      height: 100%;
      background: #0d081c;
      color: #fff;
      font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* ========== BUTTONS & INPUTS ========== */
    button {
      font: inherit;
      font-weight: 900;
      border: 0;
      border-radius: 14px;
      padding: 0.65em 1.2em;
      background: linear-gradient(180deg, #ffd166 0%, #ff9f43 100%);
      color: #3a1d00;
      box-shadow: 0 4px 0 #b86a1d, 0 6px 16px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
      letter-spacing: 0.02em;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 50%);
      border-radius: inherit;
      pointer-events: none;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b86a1d, 0 2px 8px rgba(0,0,0,0.3);
    }

    button:disabled {
      opacity: 0.4;
      filter: grayscale(0.5);
      pointer-events: none;
    }

    button.inst {
      background: linear-gradient(180deg, #7dffa8 0%, #1fc86b 100%);
      color: #04321a;
      box-shadow: 0 4px 0 #0f8a48, 0 6px 16px rgba(0,0,0,0.35);
    }

    button.inst:active {
      box-shadow: 0 1px 0 #0f8a48, 0 2px 8px rgba(0,0,0,0.3);
    }

    button.lnk {
      background: none;
      box-shadow: none;
      color: #e0d4ff;
      text-decoration: underline;
      padding: 0.2em;
      font-weight: 700;
      font-size: 0.9em;
    }

    button.lnk:active {
      transform: none;
      box-shadow: none;
    }

    button.lnk::after {
      display: none;
    }

    input {
      font: inherit;
      font-weight: 800;
      padding: 0.6em 0.9em;
      border-radius: 12px;
      border: 3px solid #6a4bb8;
      background: #1e1240;
      color: #fff;
      width: 9em;
      outline: 0;
      user-select: text;
      -webkit-user-select: text;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: 0.03em;
    }

    input:focus {
      border-color: #ffd166;
      box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.2);
    }

    input::placeholder {
      color: #8b7ab8;
      font-weight: 600;
    }

    /* ========== SCREEN LAYOUTS ========== */
    .scr {
      position: fixed;
      inset: 0;
      display: none;
    }

    .scr.on {
      display: flex;
    }

    /* ========== SPLASH SCREEN ========== */
    #splash {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 20%, #4a1f7a 0%, #0d081c 70%);
      overflow: hidden;
      position: fixed;
      inset: 0;
      z-index: 50;
      transition: opacity 0.6s ease, visibility 0.6s;
    }

    #splash.fade {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Animated background layers */
    .splash-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .splash-stars {
      position: absolute;
      inset: 0;
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .splash-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,209,102,0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulseGlow 4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    /* Floating particles */
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 8px #ffd166;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-50px) scale(1.2); opacity: 0; }
    }

    /* Logo */
    .splash-logo {
      position: relative;
      z-index: 5;
      text-align: center;
      animation: logoDrop 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes logoDrop {
      0% { transform: translateY(-80px) scale(0.6); opacity: 0; }
      60% { transform: translateY(10px) scale(1.05); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .splash-logo h1 {
      font-size: clamp(48px, 14vh, 110px);
      letter-spacing: 0.14em;
      color: #ffd166;
      text-shadow: 0 4px 0 #8a4f10, 0 6px 20px rgba(255, 180, 60, 0.6), 0 0 60px rgba(255, 209, 102, 0.3);
      line-height: 1;
      animation: logoShine 3s ease-in-out infinite;
    }

    @keyframes logoShine {
      0%, 100% { text-shadow: 0 4px 0 #8a4f10, 0 6px 20px rgba(255,180,60,0.6), 0 0 60px rgba(255,209,102,0.3); }
      50% { text-shadow: 0 4px 0 #8a4f10, 0 6px 30px rgba(255,180,60,0.9), 0 0 90px rgba(255,209,102,0.6); }
    }

    .splash-logo .sub {
      font-size: clamp(12px, 2.8vh, 22px);
      letter-spacing: 0.5em;
      color: #c4b5e8;
      font-weight: 700;
      margin-top: 8px;
      animation: fadeSlideUp 0.8s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeSlideUp {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* Bow & arrow icon animation */
    .splash-bow {
      margin-top: 20px;
      font-size: clamp(40px, 8vh, 70px);
      animation: bowBounce 2s ease-in-out infinite;
      position: relative;
      z-index: 5;
    }

    @keyframes bowBounce {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }

    /* Character showcase row */
    .splash-chars {
      display: flex;
      gap: clamp(10px, 3vw, 30px);
      margin-top: clamp(12px, 3vh, 30px);
      position: relative;
      z-index: 5;
      animation: fadeSlideUp 0.9s 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .splash-chars .ch-fig {
      animation: charFloat 3s ease-in-out infinite;
    }

    .splash-chars .ch-fig:nth-child(2) { animation-delay: 0.3s; }
    .splash-chars .ch-fig:nth-child(3) { animation-delay: 0.6s; }
    .splash-chars .ch-fig:nth-child(4) { animation-delay: 0.9s; }

    @keyframes charFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Loading / tap to start */
    .splash-start {
      margin-top: clamp(16px, 4vh, 40px);
      position: relative;
      z-index: 5;
      animation: fadeSlideUp 0.8s 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
      text-align: center;
    }

    .splash-start .pulse-btn {
      font-size: clamp(16px, 3.4vh, 24px);
      padding: 0.7em 2em;
      background: linear-gradient(180deg, #ffd166 0%, #ff9f43 100%);
      color: #3a1d00;
      box-shadow: 0 4px 0 #b86a1d, 0 0 30px rgba(255, 209, 102, 0.4);
      animation: btnPulse 2s ease-in-out infinite;
      border-radius: 50px;
      letter-spacing: 0.08em;
    }

    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 4px 0 #b86a1d, 0 0 20px rgba(255, 209, 102, 0.3); }
      50% { box-shadow: 0 4px 0 #b86a1d, 0 0 45px rgba(255, 209, 102, 0.7); }
    }

    .splash-start .pulse-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b86a1d, 0 0 15px rgba(255, 209, 102, 0.3);
    }

    /* Rotate hint */
    .splash-rotate {
      margin-top: 14px;
      font-size: clamp(10px, 1.9vh, 14px);
      color: #8b7ab8;
      font-weight: 700;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      animation: fadeSlideUp 0.8s 1.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .splash-rotate .rot-icon {
      display: inline-block;
      animation: rotateHint 3s ease-in-out infinite;
      font-size: 1.2em;
    }

    @keyframes rotateHint {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(90deg); }
      50% { transform: rotate(90deg); }
      75% { transform: rotate(0deg); }
    }

    /* Splash figure styles (reused fig markup but larger) */
    .splash-chars .fig {
      transform: scale(1.1);
      transform-origin: bottom center;
    }

    @media(max-height: 500px) {
      .splash-chars .fig {
        transform: scale(0.75);
      }
      .splash-bow {
        margin-top: 8px;
      }
    }

    /* ========== AUTH SCREEN ========== */
    #auth {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at 30% 20%, #3d1f6e 0%, #0d081c 70%);
      padding: 20px;
    }

    #auth input {
      width: min(72vw, 16em);
      text-align: center;
      font-size: 1.05em;
    }

    /* ========== MENU SCREEN ========== */
    #menu {
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 1.4vh, 12px);
      overflow-y: auto;
      overflow-x: hidden;
      padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      background: radial-gradient(circle at 30% 10%, #3d1f6e 0%, #0d081c 65%);
      -webkit-overflow-scrolling: touch;
    }

    /* ========== HEADINGS ========== */
    h1 {
      font-size: clamp(26px, 7.5vh, 52px);
      letter-spacing: 0.14em;
      color: #ffd166;
      text-shadow: 0 3px 0 #8a4f10, 0 5px 14px rgba(255, 180, 60, 0.4);
      margin-top: 4px;
      margin-bottom: 2px;
      line-height: 1.1;
      text-align: center;
    }

    h1 small {
      display: block;
      font-size: 0.32em;
      color: #c4b5e8;
      letter-spacing: 0.35em;
      margin-top: 2px;
      font-weight: 700;
    }

    /* ========== ROW LAYOUT ========== */
    .row {
      display: flex;
      gap: clamp(6px, 1.4vw, 14px);
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
    }

    /* ========== CHARACTER CARDS ========== */
    .ch {
      background: linear-gradient(180deg, #2a1a57 0%, #1e1240 100%);
      border: 3px solid #4b3490;
      border-radius: 16px;
      padding: 8px 10px 6px;
      text-align: center;
      cursor: pointer;
      font-size: clamp(10px, 2.2vh, 14px);
      font-weight: 800;
      transition: transform 0.18s, border-color 0.18s, background 0.18s, box-shadow 0.18s;
      min-width: 60px;
      position: relative;
    }

    .ch.on {
      border-color: #ffd166;
      background: linear-gradient(180deg, #3d2680 0%, #2a1a57 100%);
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 6px 18px rgba(255, 209, 102, 0.25);
    }

    .ch:active {
      transform: translateY(-2px) scale(1.02);
    }

    /* ========== SCENE CHIPS ========== */
    .chip {
      padding: 0.45em 1em;
      border-radius: 99px;
      background: linear-gradient(180deg, #2a1a57 0%, #1e1240 100%);
      border: 3px solid #4b3490;
      font-weight: 800;
      font-size: clamp(10px, 2.4vh, 14px);
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s, transform 0.18s;
      letter-spacing: 0.03em;
    }

    .chip.on {
      border-color: #ffd166;
      background: linear-gradient(180deg, #3d2680 0%, #2a1a57 100%);
      transform: scale(1.05);
      box-shadow: 0 3px 12px rgba(255, 209, 102, 0.2);
    }

    .chip:active {
      transform: scale(1.02);
    }

    /* ========== MESSAGE ========== */
    #msg {
      min-height: 1.3em;
      color: #ff8fab;
      font-weight: 800;
      font-size: clamp(11px, 2.4vh, 15px);
      text-align: center;
      transition: opacity 0.3s;
      letter-spacing: 0.02em;
      padding: 0 8px;
    }

    /* ========== FIGURE PREVIEW ========== */
    .fig {
      position: relative;
      width: 46px;
      height: 94px;
      margin: 6px auto;
    }

    .fig i {
      position: absolute;
      display: block;
    }

    .hd {
      left: 7px;
      top: 6px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--skin);
      z-index: 2;
    }

    .hd::before {
      content: '';
      position: absolute;
      left: 19px;
      top: 12px;
      width: 5px;
      height: 6px;
      border-radius: 50%;
      background: #111;
      z-index: 3;
    }

    .bd {
      left: 3px;
      top: 38px;
      width: 40px;
      height: 34px;
      border-radius: 10px 10px 4px 4px;
      background: var(--body);
    }

    .lg {
      left: 8px;
      top: 70px;
      width: 30px;
      height: 24px;
      border-radius: 0 0 6px 6px;
      background: linear-gradient(90deg, var(--leg) 44%, transparent 44% 56%, var(--leg) 56%);
    }

    .ht {
      z-index: 4;
    }

    .knight .ht {
      left: 3px;
      top: -1px;
      width: 40px;
      height: 20px;
      border-radius: 20px 20px 3px 3px;
      background: #b9c4d6;
      border-bottom: 5px solid #6f7c94;
    }

    .knight .ht::after {
      content: '';
      position: absolute;
      left: 14px;
      top: -14px;
      width: 10px;
      height: 17px;
      border-radius: 50% 50% 0 0;
      background: #e63946;
    }

    .pirate .ht {
      left: -4px;
      top: -8px;
      width: 54px;
      height: 24px;
      background: #1d1d1d;
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
    }

    .pirate .hd::after {
      content: '';
      position: absolute;
      left: 15px;
      top: 9px;
      width: 12px;
      height: 11px;
      border-radius: 50%;
      background: #111;
      z-index: 3;
    }

    .ninja .ht {
      left: 7px;
      top: 14px;
      width: 32px;
      height: 8px;
      background: #ff3b5c;
    }

    .ninja .ht::after {
      content: '';
      position: absolute;
      left: -12px;
      top: -2px;
      width: 14px;
      height: 10px;
      background: #ff3b5c;
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
    }

    .ninja .hd::after {
      content: '';
      position: absolute;
      left: 0;
      top: 19px;
      width: 32px;
      height: 13px;
      border-radius: 0 0 16px 16px;
      background: #2b2b3d;
      z-index: 3;
    }

    .wizard .ht {
      left: -2px;
      top: -26px;
      width: 50px;
      height: 42px;
      background: #5b3df5;
      clip-path: polygon(50% 0, 70% 70%, 100% 78%, 100% 92%, 0 92%, 0 78%, 30% 70%);
    }

    .wizard .hd::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 20px;
      width: 26px;
      height: 28px;
      background: #f2f2f2;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      z-index: 3;
    }

    @media(max-height: 420px) {
      .fig {
        transform: scale(0.62);
        margin: -14px auto -10px;
      }
    }

    /* ========== GAME SCREEN ========== */
    #game {
      background: #000;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* ========== HUD ========== */
    #hud {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      right: max(56px, env(safe-area-inset-right));
      display: flex;
      gap: 10px;
      pointer-events: none;
      align-items: flex-start;
    }

    .hp {
      flex: 1;
      max-width: 34%;
      font-weight: 900;
      font-size: clamp(11px, 2.5vh, 16px);
      text-shadow: 0 2px 0 rgba(0,0,0,0.6);
      transition: opacity 0.3s;
    }

    .hp.r {
      text-align: right;
    }

    .hp div {
      height: clamp(10px, 2.6vh, 18px);
      background: rgba(0,0,0,0.5);
      border-radius: 9px;
      border: 2px solid rgba(255,255,255,0.7);
      overflow: hidden;
      margin-top: 3px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
    }

    .hp.r div {
      transform: scaleX(-1);
    }

    .hp i {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(180deg, #7dffa8 0%, #1fc86b 100%);
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(125, 255, 168, 0.4);
    }

    #turn {
      flex: 1;
      text-align: center;
      font-weight: 900;
      font-size: clamp(12px, 3vh, 20px);
      text-shadow: 0 2px 0 rgba(0,0,0,0.6);
      transition: opacity 0.3s;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }

    /* ========== WEAPON PICKER ========== */
    #wp {
      position: fixed;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 5;
    }

    #wp button {
      font-size: clamp(11px, 2.6vh, 15px);
      padding: 0.5em 1em;
      background: rgba(30, 18, 64, 0.85);
      color: #e0d4ff;
      box-shadow: 0 3px 0 rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
      border: 3px solid #6a4bb8;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      letter-spacing: 0.02em;
    }

    #wp button.on {
      border-color: #ffd166;
      background: rgba(91, 61, 184, 0.9);
      color: #fff;
      box-shadow: 0 3px 0 rgba(0,0,0,0.4), 0 0 16px rgba(255, 209, 102, 0.35);
    }

    #wp button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.4);
    }

    /* ========== ICON BUTTONS ========== */
    .ib {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      width: 42px;
      height: 42px;
      padding: 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(30, 18, 64, 0.8);
      border: 3px solid #6a4bb8;
      color: #fff;
      box-shadow: 0 3px 0 rgba(0,0,0,0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 6;
    }

    #fs {
      top: max(56px, calc(env(safe-area-inset-top) + 48px));
    }

    .ib:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.4);
    }

    /* ========== BANNER ========== */
    #ban {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-size: clamp(28px, 13vh, 96px);
      font-weight: 900;
      color: #ffd166;
      -webkit-text-stroke: 3px #7a1f00;
      text-shadow: 0 6px 0 #7a1f00, 0 8px 24px rgba(0,0,0,0.6);
      opacity: 0;
      text-align: center;
      z-index: 10;
      letter-spacing: 0.04em;
      padding: 0 20px;
    }

    #ban.show {
      animation: ban 1.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes ban {
      0% { opacity: 0; transform: scale(0.3); }
      18% { opacity: 1; transform: scale(1.15); }
      30% { transform: scale(1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.25); }

try {

try { pref = JSON.parse(localStorage.getItem('aimit') || '{}'); } catch (e) { }

/* ============================================================
   SPLASH SCREEN SETUP

function buildSplash() {

  }

/* Figure markup (reused) */
const fig = c => `<div class="fig ${c.k}" style="--skin:${c.sk};--body:${c.bd};--leg:${c.lg}"><i class="lg"></i><i class="bd"></i><i class="hd"></i><i class="ht"></i></div>`;

buildSplash();

/* Splash → Auth/Menu transition */
$('splashBtn').onclick = () => {
  $('splash').classList.add('fade');
  setTimeout(() => {
    $('splash').classList.remove('on');
    /* Route to auth or menu depending on firebase user */
    if (auth) {
      /* onAuthStateChanged will route automatically */
      if (!user) show('auth');
    } else {
      show('auth');
    }
  }, 650);
};

/* ============================================================
   MENU BUILDING
   ============================================================ */
function buildMenu() {
  $('chars').innerHTML = CH.map((c, i) =>
    `<div class="ch${i == me.ch ? ' on' : ''}" data-i="${i}">${fig(c)}${c.n}</div>`
  ).join('');

  $('scenes').innerHTML = [...SC.map(s => s.n), 'Random'].map((n, i) =>
    `<div class="chip${i == me.sc ? ' on' : ''}" data-i="${i}">${n}</div>`
  ).join('');

  const sel = me.sc === 4 ? null : SC[me.sc];

  $('chars').onclick = e => {

    const t = e.target.closest('.chip');

  };
}
buildMenu();

const msg = t => $('msg').textContent = t || '';
const show = id => document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id));
const nameOf = () => me.name;
const pickScene = () => me.sc == 4 ? Math.random() * 4 | 0 : me.sc;

/* Fullscreen helper */
function fsGo() {
  try {
    const d = document.documentElement;
    (d.requestFullscreen ? d.requestFullscreen() : Promise.resolve())
      .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
      .catch(() => { });
  } catch (e) { }
}
$('fs').onclick = fsGo;

/* ============================================================
   GAME STATE
   ============================================================ */
const cv = $('cv');
const c = cv.getContext('2d');

let st = null, P = [], sim = null, stuck = [], fx = [], tx = [];
let obstacles = [];
let shotN = 0, lastN = 0, botErr = .4, botWait = 0, drag = null, wsel = 0;
let sc = 1, ox = 0, oy = 0, dpr = 1, acc = 0, last = 0, T = 0;

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  sc = Math.min(cv.width / W, cv.height / H);
  ox = (cv.width - W * sc) / 2;
  oy = (cv.height - H * sc) / 2;
}
addEventListener('resize', resize);

const X = e => (e.clientX * dpr - ox) / sc;
const Y = e => (e.clientY * dpr - oy) / sc;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ============================================================
   START GAME
   ============================================================ */
function startGame(o) {
  const mk = (d, i) => ({
    name: d.name,
    ch: d.ch,
    f: i ? -1 : 1,
    x: i ? W - 220 : 220,
    dx: i ? W - 220 : 220,
    hp: 100,
    fin: 0,
    dead: 0,
    lean: 0,
    rec: 0,
    parts: null
  });

  st = { mode: o.mode, my: o.my, sc: o.sc, turn: 0, over: 0, win: -1 };
  P = [mk(o.a, 0), mk(o.b, 1)];
  sim = null; stuck = []; fx = []; tx = []; shotN = 0; lastN = 0;
  botErr = .4; botWait = 0; drag = null; started = true;

  obstacles = SC[o.sc].obs.map(o2 => ({
    type: o2.type,
    x: o2.x,
    baseX: o2.x,
    w: o2.w,
    h: o2.h,
    hp: o2.hp,
    maxHp: o2.maxHp,
    shake: 0,
    destroyed: false
  }));

  $('n0').textContent = P[0].name;
  $('n1').textContent = P[1].name;
  $('end').classList.remove('on');
  $('obsInfo').textContent = SC[o.sc].obsLabel;
  show('game');
  resize();
  hud();
  ban('FIGHT!');
  fsGo();
}

function ban(t) {
  const b = $('ban');
  b.textContent = t;
  b.classList.remove('show');
  void b.offsetWidth;
  b.classList.add('show');
}

/* ============================================================
   HUD UPDATE
   ============================================================ */
function hud() {
  if (!st) return;
  P.forEach((p, i) => $('h' + i).style.width = p.hp + '%');

  const mine = st.turn == st.my;
  const fin = P[1 - st.turn].fin;

  $('turn').textContent = st.over
    ? ''
    : (fin ? 'FINISH HIM! ' : '') +
      (mine
        ? 'Your turn — drag back & release'
        : (st.mode == 'bot' ? 'Bot is aiming...' : P[st.turn].name + ' is aiming...'));

  document.querySelectorAll('#wp button').forEach(b => {
    b.classList.toggle('on', +b.dataset.w == wsel);
    b.disabled = !mine || !!sim || !!st.over;
  });
}

document.querySelectorAll('#wp button').forEach(b => {
  b.onclick = () => { wsel = +b.dataset.w; hud(); };
});

/* ============================================================
   INPUT (aiming)
   ============================================================ */
cv.onpointerdown = e => {
  e.preventDefault();
  if (!st) return;

  if (sim) {
    if (sim.by == st.my && sim.w == 2 && sim.sp < 0 && !sim.rec) sim.sp = sim.step;
    return;
  }
  if (st.over || st.turn != st.my) return;

  drag = { sx: X(e), sy: Y(e), cx: X(e), cy: Y(e) };
  try { cv.setPointerCapture(e.pointerId); } catch (x) { }
};

cv.onpointermove = e => {
  if (drag) { drag.cx = X(e); drag.cy = Y(e); }
};

cv.onpointerup = cv.onpointercancel = () => {
  if (!drag) return;
  const a = aimOf();
  drag = null;
  if (a.pw > 8) fire(st.my, a.a, a.pw, wsel, -1, null);
};

function aimOf() {
  const p = P[st.my];
  const lx = drag.sx - drag.cx;
  const ly = drag.sy - drag.cy;
  return {
    a: clamp(Math.atan2(-ly, lx * p.f) * 180 / PI, -5, 85),
    pw: Math.min(100, Math.hypot(lx, ly) / 2.2)
  };
}

/* ============================================================
   PHYSICS
   ============================================================ */
const mkp = (x, y, vx, vy, k) => ({ x, y, vx, vy, k, rot: 0 });

function fire(by, a, pw, w, sp, rec) {
  const p = P[by];
  const r = a * PI / 180;
  const s = pw / 100 * V * (w == 1 ? .8 : 1);

  sim = {
    by, w, sp, step: 0,
    fin: P[1 - by].fin,
    rec, a, pw,
    pr: [mkp(p.x, GY - 70, p.f * Math.cos(r) * s, -Math.sin(r) * s, w)]
  };
  p.rec = 1;
  hud();
}

function checkObstacle(q, r) {
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.destroyed) continue;

    const left = o.x - o.w / 2;
    const right = o.x + o.w / 2;
    const top = GY - o.h;
    const bottom = GY;

    if (q.x + r > left && q.x - r < right && q.y + r > top && q.y - r < bottom) {
      return i;
    }
  }
  return -1;
}

function stepSim() {
  const s = sim;
  const t = P[1 - s.by];

  if (s.w == 2 && s.sp == s.step && s.pr.length) {
    const m = s.pr[0];
    [-.2, .2].forEach(d => {
      const co = Math.cos(d), si = Math.sin(d);
      s.pr.push(mkp(m.x, m.y, m.vx * co - m.vy * si, m.vx * si + m.vy * co, 2));
    });
    burst(m.x, m.y, '#ffd166', 14);
  }

  for (let i = s.pr.length - 1; i >= 0; i--) {
    const q = s.pr[i];
    q.vy += G * DT;
    q.x += q.vx * DT;
    q.y += q.vy * DT;
    q.rot = q.k == 1 ? q.rot + 14 * DT : Math.atan2(q.vy, q.vx);

    const r = q.k == 1 ? 26 : 6;
    let h = 0;

    const oi = checkObstacle(q, r);
    if (oi >= 0) {
      const o = obstacles[oi];
      o.hp--;
      o.shake = 1;
      burst(q.x, q.y, o.type === 'icewall' ? '#9fdcff' : '#c9a46a', 10);
      txt(o.x, GY - o.h - 20, 'CRASH!', '#ff8fab', 24);

      if (o.hp <= 0) {
        o.destroyed = true;
        o.shake = 1.5;
        burst(o.x, GY - o.h / 2, '#ffd166', 20);
        txt(o.x, GY - o.h / 2, 'DESTROYED!', '#ffd166', 28);
      }

      s.pr.splice(i, 1);
      continue;
    }

    if (!t.dead && Math.hypot(q.x - t.x, q.y - (GY - 100)) < 22 + r) h = 2;
    else if (!t.dead && Math.abs(q.x - t.x) < 24 + r * .5 && q.y > GY - 80 - r * .3 && q.y < GY) h = 1;

    if (h) {
      hit(s, q, t, h == 2);
      s.pr.splice(i, 1);
    } else if (q.y >= GY) {
      stuck.push({ x: q.x, y: GY, rot: q.rot, k: q.k, l: 4 });
      s.pr.splice(i, 1);
    } else if (q.x < -150 || q.x > W + 150) {
      s.pr.splice(i, 1);
    }
  }

  s.step++;
  if (!s.pr.length || s.step > 1500) endShot();
}

function hit(s, q, t, head) {
  const dmg = [[18, 45], [30, 65], [12, 30]][s.w][head ? 1 : 0];
  const f = P[s.by].f;

  burst(q.x, q.y, head ? '#ffd166' : '#ff5d8f', head ? 22 : 12);

  if (t.fin) {
    t.hp = 0;
    t.dead = 1;
    ragdoll(t, f);
    txt(t.x, GY - 140, 'FATALITY!', '#ff3b5c', 46);
    ban('FATALITY!');
  } else {
    t.hp = Math.max(0, t.hp - dmg);
    t.x = clamp(t.x + f * (25 + dmg * 1.4), 80, W - 80);
    t.lean = 1;
    txt(t.x, GY - 150, (head ? 'HEADSHOT -' : '-') + dmg, head ? '#ffd166' : '#fff', head ? 40 : 30);
    if (head) ban('HEADSHOT!');
    if (t.hp <= 0) t.fin = 1;
  }
}

function endShot() {
  const s = sim;
  const op = P[1 - s.by];
  sim = null;
  let nx = 1 - s.by;

  if (op.dead) {
    st.over = 1;
    st.win = s.by;
    nx = s.by;
  } else if (s.fin) {
    op.fin = 0;
    op.hp = 15;
    ban('SURVIVED!');
  } else if (op.fin) {
    nx = s.by;
    ban('FINISH HIM!');
  }

  const r = s.rec;

  if (r) {
    P.forEach((p, i) => {
      p.hp = r.hp[i];
      p.x = r.x[i];
      p.fin = r.fin[i] ? 1 : 0;
    });
    nx = r.nx;
    if (r.over) { st.over = 1; st.win = r.by; }
  } else if (st.mode == 'net' && ref) {
    ref.child('shot').set({
      n: ++shotN, by: s.by, a: s.a, pw: s.pw, w: s.w, sp: s.sp,
      hp: P.map(p => p.hp), x: P.map(p => p.x), fin: P.map(p => p.fin),
      nx, over: st.over ? 1 : 0,
      obs: obstacles.map(o => ({ hp: o.hp, destroyed: o.destroyed ? 1 : 0 }))
    });
  }

  st.turn = nx;
  hud();

  if (st.over) {
    setTimeout(() => {
      $('et').textContent = st.win == st.my ? 'VICTORY!' : 'DEFEATED';
      $('end').classList.add('on');
    }, 2200);
  }
}

function ragdoll(t, f) {
  t.parts = [100, 55, 15, 15, 60, 60].map((y, i) => ({
    k: i,
    x: t.dx,
    y: GY - y,
    vx: f * (200 + Math.random() * 500) + (Math.random() - .5) * 200,
    vy: -400 - Math.random() * 500,
    r: 0,
    vr: (Math.random() - .5) * 14
  }));
}

const burst = (x, y, col, n) => {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 7;
    const s = 100 + Math.random() * 320;
    fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 100, l: .6 + Math.random() * .4, c: col });
  }
};

const txt = (x, y, s, c2, z) => tx.push({ x, y, s, c: c2, z, l: 1.4 });

/* ============================================================
   BOT AI
   ============================================================ */
function botShot() {
  botWait = 0;
  if (!st || st.over || sim || st.turn != 1 || st.mode != 'bot') return;

  const d = Math.abs(P[1].x - P[0].x);
  const w = Math.random() < .25 ? 1 : (Math.random() < .2 ? 2 : 0);
  const a = .5 + Math.random() * .35;

  let pw = Math.sqrt(d * G / Math.sin(2 * a)) / (V * (w == 1 ? .8 : 1)) * 100;
  pw *= 1 + (Math.random() - .5) * botErr;
  botErr = Math.max(.05, botErr * .72);

  const blocker = obstacles.find(o => !o.destroyed && Math.abs(o.x - (P[0].x + P[1].x) / 2) < 100);
  const aimAdj = blocker ? (Math.random() - .5) * 8 : 0;

  fire(1, a * 180 / PI + aimAdj + (Math.random() - .5) * botErr * 14, clamp(pw, 15, 100), w, -1, null);
}

/* ============================================================
   RENDERING
   ============================================================ */
const hsh = n => {
  const v = Math.sin(n * 127.1) * 43758.5;
  return v - Math.floor(v);
};

function scene() {
  const s = SC[st.sc];
  let g = c.createLinearGradient(0, -200, 0, GY);
  g.addColorStop(0, s.sky[0]);
  g.addColorStop(1, s.sky[1]);
  c.fillStyle = g;
  c.fillRect(-500, -300, W + 1000, H + 800);

  if (s.x == 'snow') {
    c.fillStyle = '#fff';
    for (let i = 0; i < 70; i++) {
      c.globalAlpha = .4 + .6 * Math.abs(Math.sin(T * 2 + i));
      c.fillRect(hsh(i) * W, hsh(i + 99) * 500, 2.5, 2.5);
    }
    c.globalAlpha = 1;
  }

  c.fillStyle = s.orb[2];
  c.shadowColor = s.orb[2];
  c.shadowBlur = 60;
  c.beginPath();
  c.arc(s.orb[0], s.orb[1], s.orb[3], 0, 7);
  c.fill();
  c.shadowBlur = 0;

  s.hill.forEach((col, k) => {
    c.fillStyle = col;
    c.beginPath();
    c.moveTo(-500, GY);
    for (let x = -500; x <= W + 500; x += 40) {
      c.lineTo(x, GY - 90 - k * 55 - Math.sin(x * .004 * (k + 1.3) + k * 2) * (45 + k * 35));
    }
    c.lineTo(W + 500, GY);
    c.fill();
  });

  if (s.x == 'clouds') {
    c.fillStyle = '#fff';
    for (let i = 0; i < 5; i++) {
      const x = (T * 18 + i * 420) % 2100 - 250;
      const y = 90 + hsh(i) * 160;
      c.globalAlpha = .9;
      c.beginPath();
      c.ellipse(x, y, 80, 24, 0, 0, 7);
      c.ellipse(x + 40, y - 16, 50, 26, 0, 0, 7);
      c.fill();
    }
    c.globalAlpha = 1;
  }

  if (s.x == 'embers') {
    c.fillStyle = '#ffb347';
    for (let i = 0; i < 45; i++) {
      c.globalAlpha = .8;
      c.fillRect(hsh(i) * W + Math.sin(T + i) * 20, (H - ((T * 50 + hsh(i + 7) * H) % H)), 3, 3);
    }
    c.globalAlpha = 1;
  }

  [560, 800, 1040].forEach((x, i) => prop(s.pr, x + (i - 1) * 30, GY, .8 + hsh(i + 3) * .5));

  g = c.createLinearGradient(0, GY, 0, H + 200);
  g.addColorStop(0, s.gr[0]);
  g.addColorStop(1, s.gr[1]);
  c.fillStyle = g;
  c.fillRect(-500, GY, W + 1000, H);
}

function prop(k, x, y, z) {
  c.save();
  c.translate(x, y);
  c.scale(z, z);

  if (k == 'tree') {
    c.fillStyle = '#7a4a21';
    c.fillRect(-8, -70, 16, 70);
    c.fillStyle = '#2e9d46';
    c.beginPath();
    c.arc(0, -95, 44, 0, 7);
    c.arc(-26, -72, 28, 0, 7);
    c.arc(26, -72, 28, 0, 7);
    c.fill();
  } else if (k == 'cactus') {
    c.fillStyle = '#3f8f4a';
    c.fillRect(-9, -100, 18, 100);
    c.fillRect(-34, -70, 14, 10);
    c.fillRect(-34, -90, 10, 30);
    c.fillRect(20, -60, 14, 10);
    c.fillRect(26, -82, 10, 30);
  } else if (k == 'pine') {
    c.fillStyle = '#2f6b57';
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.moveTo(-40 + i * 8, -i * 34);
      c.lineTo(0, -70 - i * 34);
      c.lineTo(40 - i * 8, -i * 34);
      c.fill();
    }
    c.fillStyle = '#fff';
    c.fillRect(-14, -96, 28, 5);
  } else {
    c.fillStyle = '#1a0c0c';
    c.beginPath();
    c.moveTo(-40, 0);
    c.lineTo(-8, -120);
    c.lineTo(10, -90);
    c.lineTo(40, 0);
    c.fill();
    c.fillStyle = '#ff6a2a';
    c.fillRect(-4, -118, 6, 60);
  }

  c.restore();
}

/* ---------- OBSTACLE RENDERING ---------- */
function drawObstacles() {
  obstacles.forEach(o => {
    if (o.destroyed) {
      c.save();
      c.translate(o.baseX, GY);
      c.fillStyle = 'rgba(80,60,40,0.5)';
      const n = Math.floor(o.w / 18);
      for (let i = 0; i < n; i++) {
        const rx = (i - n / 2) * 18 + (hsh(i) - .5) * 10;
        const ry = -6 - hsh(i + 5) * 12;
        c.beginPath();
        c.ellipse(rx, ry, 10 + hsh(i + 2) * 6, 5 + hsh(i + 3) * 4, 0, 0, 7);
        c.fill();
      }
      c.restore();
      return;
    }

    const shakeX = o.shake > 0 ? Math.sin(T * 60) * o.shake * 6 : 0;
    const shakeY = o.shake > 0 ? Math.cos(T * 55) * o.shake * 3 : 0;

    c.save();
    c.translate(o.baseX + shakeX, GY + shakeY);

    if (o.type === 'hill') {
      c.fillStyle = '#5f9e46';
      c.beginPath();
      c.moveTo(-o.w / 2, 0);
      c.quadraticCurveTo(0, -o.h * 1.3, o.w / 2, 0);
      c.fill();
      c.fillStyle = '#7fc45e';
      c.beginPath();
      c.moveTo(-o.w / 2, 0);
      c.quadraticCurveTo(-o.w / 6, -o.h * .9, o.w / 2, 0);
      c.fill();
      c.fillStyle = '#3d7a28';
      for (let i = 0; i < 5; i++) {
        const gx = (i - 2) * (o.w / 6);
        c.fillRect(gx, -8, 3, 8);
      }
    } else if (o.type === 'rock') {
      c.fillStyle = '#6b6b7a';
      c.beginPath();
      c.moveTo(-o.w / 2, 0);
      c.lineTo(-o.w / 2 + 6, -o.h * .7);
      c.lineTo(-o.w / 6, -o.h);
      c.lineTo(o.w / 3, -o.h * .85);
      c.lineTo(o.w / 2, -o.h * .3);
      c.lineTo(o.w / 2 - 4, 0);
      c.fill();
      c.fillStyle = '#8a8a9a';
      c.beginPath();
      c.moveTo(-o.w / 2 + 6, -o.h * .7);
      c.lineTo(-o.w / 6, -o.h);
      c.lineTo(o.w / 3, -o.h * .85);
      c.lineTo(0, -o.h * .6);
      c.fill();
    } else if (o.type === 'cactus') {
      c.fillStyle = '#3f8f4a';
      c.fillRect(-o.w / 2, -o.h, o.w, o.h);
      c.fillRect(-o.w * 1.3, -o.h * .7, o.w * .9, o.w * .3);
      c.fillRect(-o.w * 1.3, -o.h * .9, o.w * .3, o.h * .4);
      c.fillRect(o.w * .5, -o.h * .55, o.w * .9, o.w * .3);
      c.fillRect(o.w * .9, -o.h * .75, o.w * .3, o.h * .35);
      c.fillStyle = '#2e6b38';
      c.fillRect(-o.w / 2 + 2, -o.h * .6, 3, 3);
      c.fillRect(o.w / 4, -o.h * .3, 3, 3);
    } else if (o.type === 'dune') {
      c.fillStyle = '#c98a4a';
      c.beginPath();
      c.moveTo(-o.w / 2, 0);
      c.quadraticCurveTo(-o.w / 4, -o.h * 1.1, 0, -o.h);
      c.quadraticCurveTo(o.w / 4, -o.h * .8, o.w / 2, 0);
      c.fill();
      c.fillStyle = '#e0a55a';
      c.beginPath();
      c.moveTo(-o.w / 2, 0);
      c.quadraticCurveTo(-o.w / 6, -o.h * .6, o.w / 2, 0);
      c.fill();
    } else if (o.type === 'icewall') {
      c.fillStyle = 'rgba(180,230,255,0.85)';
      c.fillRect(-o.w / 2, -o.h, o.w, o.h);
      c.fillStyle = 'rgba(220,245,255,0.9)';
      c.beginPath();
      c.moveTo(-o.w / 2, -o.h);
      c.lineTo(-o.w / 6, -o.h - 15);
      c.lineTo(o.w / 3, -o.h);
      c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.6)';
      c.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        c.beginPath();
        c.moveTo(-o.w / 2 + 10 + i * 30, -o.h);
        c.lineTo(-o.w / 2 + 20 + i * 30, 0);
        c.stroke();
      }
      c.fillStyle = 'rgba(255,255,255,0.8)';
      c.fillRect(-o.w / 2, -o.h, 4, o.h);
    } else if (o.type === 'snowdrift') {
      c.fillStyle = '#eaf2ff';
      c.beginPath();
      c.moveTo(-o.w / 2, 0);
      c.quadraticCurveTo(0, -o.h * 1.3, o.w / 2, 0);
      c.fill();
      c.fillStyle = '#ffffff';
      c.beginPath();
      c.moveTo(-o.w / 2, 0);
      c.quadraticCurveTo(-o.w / 4, -o.h * .7, 0, -o.h * .5);
      c.quadraticCurveTo(o.w / 4, -o.h * .4, o.w / 2, 0);
      c.fill();
    } else if (o.type === 'pillar') {
      c.fillStyle = '#3a1e1e';
      c.fillRect(-o.w / 2, -o.h, o.w, o.h);
      c.fillStyle = '#5a2e2e';
      c.fillRect(-o.w / 2, -o.h, o.w * .4, o.h);
      c.fillStyle = '#ff6a2a';
      c.fillRect(-o.w / 2 + 4, -o.h * .5, o.w - 8, 4);
      c.fillStyle = '#ffb347';
      c.fillRect(-o.w / 2 + 4, -o.h * .3, o.w - 8, 2);
    } else if (o.type === 'lavarock') {
      c.fillStyle = '#4a2020';
      c.beginPath();
      c.ellipse(0, -o.h * .4, o.w / 2, o.h * .6, 0, 0, 7);
      c.fill();
      c.fillStyle = '#ff6a2a';
      c.beginPath();
      c.ellipse(0, -o.h * .4, o.w / 2.5, o.h * .35, 0, 0, 7);
      c.fill();
      c.fillStyle = '#ffd166';
      c.beginPath();
      c.ellipse(-8, -o.h * .45, o.w / 6, o.h * .15, 0, 0, 7);
      c.fill();
      c.fillStyle = 'rgba(255,100,40,0.3)';
      c.beginPath();
      c.ellipse(0, -o.h * .3, o.w * .7, o.h * .3, 0, 0, 7);
      c.fill();
    }

    if (o.hp < o.maxHp) {
      for (let i = 0; i < o.maxHp; i++) {
        c.fillStyle = i < o.hp ? '#7dffa8' : 'rgba(255,255,255,0.2)';
        c.beginPath();
        c.arc(-o.w / 2 + 8 + i * 12, -o.h - 12, 4, 0, 7);
        c.fill();
      }
    }

    c.restore();
  });
}

function drawHead(ch, f) {
  c.fillStyle = ch.sk;
  c.beginPath();
  c.arc(0, 0, 22, 0, 7);
  c.fill();

  if (ch.k == 'ninja') {
    c.fillStyle = '#2b2b3d';
    c.beginPath();
    c.arc(0, 0, 22, 0, PI);
    c.fill();
    c.fillStyle = '#ff3b5c';
    c.fillRect(-22, -13, 44, 8);
    c.beginPath();
    c.moveTo(-f * 22, -10);
    c.lineTo(-f * 46, -22);
    c.lineTo(-f * 40, -2);
    c.fill();
  }
  if (ch.k == 'wizard') {
    c.fillStyle = '#f2f2f2';
    c.beginPath();
    c.moveTo(-17, 6);
    c.lineTo(17, 6);
    c.lineTo(0, 44);
    c.fill();
  }

  c.fillStyle = '#111';
  c.beginPath();
  c.arc(f * 9, -2, 3, 0, 7);
  c.fill();

  if (ch.k == 'knight') {
    c.fillStyle = '#b9c4d6';
    c.beginPath();
    c.arc(0, -4, 25, PI, 0);
    c.fill();
    c.fillStyle = '#6f7c94';
    c.fillRect(-25, -6, 50, 7);
    c.fillStyle = '#e63946';
    c.beginPath();
    c.ellipse(-f * 2, -34, 6, 12, 0, 0, 7);
    c.fill();
  }
  if (ch.k == 'pirate') {
    c.fillStyle = '#1d1d1d';
    c.beginPath();
    c.moveTo(-36, -8);
    c.lineTo(0, -42);
    c.lineTo(36, -8);
    c.fill();
    c.fillStyle = '#fff';
    c.fillRect(-3, -22, 6, 6);
    c.fillStyle = '#111';
    c.beginPath();
    c.arc(f * 9, -2, 7, 0, 7);
    c.fill();
  }
  if (ch.k == 'wizard') {
    c.fillStyle = '#5b3df5';
    c.beginPath();
    c.moveTo(-38, -10);
    c.lineTo(-14, -14);
    c.lineTo(0, -64);
    c.lineTo(14, -14);
    c.lineTo(38, -10);
    c.lineTo(38, -3);
    c.lineTo(-38, -3);
    c.fill();
    c.fillStyle = '#ffd166';
    c.beginPath();
    c.arc(0, -30, 4, 0, 7);
    c.fill();
  }
}

function drawChar(p, i, aim) {
  const ch = CH[p.ch];
  const f = p.f;

  if (p.dead) {
    (p.parts || []).forEach(q => {
      c.save();
      c.translate(q.x, q.y);
      c.rotate(q.r);
      if (q.k == 0) drawHead(ch, f);
      else if (q.k == 1) { c.fillStyle = ch.bd; c.fillRect(-22, -25, 44, 50); }
      else if (q.k < 4) { c.fillStyle = ch.lg; c.fillRect(-6, -15, 12, 30); }
      else { c.fillStyle = ch.sk; c.fillRect(-4, -18, 8, 36); }
      c.restore();
    });
    return;
  }

  c.save();
  c.translate(p.dx, GY);
  c.rotate(-f * p.lean * .5 - (p.fin ? f * .45 : 0));
  if (p.fin) c.scale(1, .9);

  c.fillStyle = 'rgba(0,0,0,0.25)';
  c.beginPath();
  c.ellipse(0, 0, 34, 8, 0, 0, 7);
  c.fill();

  c.fillStyle = ch.lg;
  c.fillRect(-15, -30, 12, 30);
  c.fillRect(3, -30, 12, 30);

  c.fillStyle = ch.bd;
  c.beginPath();
  c.roundRect(-22, -78, 44, 50, 10);
  c.fill();

  const a = (aim == null ? 30 : aim) * PI / 180;
  const ax = f * Math.cos(a), ay = -Math.sin(a);
  const rc = p.rec * 8;

  c.strokeStyle = ch.sk;
  c.lineWidth = 8;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(0, -62);
  c.lineTo(ax * 32 - ax * rc, -62 + ay * 32 - ay * rc);
  c.stroke();

  const hx = ax * 34 - ax * rc;
  const hy = -62 + ay * 34 - ay * rc;

  c.save();
  c.translate(hx, hy);
  c.rotate(Math.atan2(ay, ax));

  if (wsel == 1 && i == st.my) {
    c.fillStyle = '#7a4a21';
    c.fillRect(-4, -3, 36, 6);
    c.fillStyle = '#cfd8e3';
    c.beginPath();
    c.moveTo(24, -3);
    c.lineTo(30, -24);
    c.lineTo(42, -6);
    c.lineTo(32, 8);
    c.fill();
  } else {
    c.strokeStyle = wsel == 2 && i == st.my ? '#ffd166' : '#8b5a2b';
    c.lineWidth = 5;
    c.beginPath();
    c.arc(0, 0, 26, -1.2, 1.2);
    c.stroke();
    c.strokeStyle = '#fff9';
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(26 * Math.cos(-1.2), 26 * Math.sin(-1.2));
    c.lineTo(-6, 0);
    c.lineTo(26 * Math.cos(1.2), 26 * Math.sin(1.2));
    c.stroke();
  }
  c.restore();

  c.translate(0, -100);
  drawHead(ch, f);

  if (p.fin) {
    c.font = '28px sans-serif';
    c.textAlign = 'center';
    c.fillText('\u{1F4AB}', 0, -34 + Math.sin(T * 8) * 4);
  }

  c.restore();
}

function projDraw(q) {
  c.save();
  c.translate(q.x, q.y);
  c.rotate(q.rot);

  if (q.k == 1) {
    c.fillStyle = '#7a4a21';
    c.fillRect(-4, -30, 8, 50);
    c.fillStyle = '#dfe7f1';
    c.beginPath();
    c.moveTo(4, -30);
    c.lineTo(34, -24);
    c.lineTo(34, -2);
    c.lineTo(4, -8);
    c.fill();
  } else {
    c.fillStyle = '#8b5a2b';
    c.fillRect(-28, -2, 40, 4);
    c.fillStyle = q.k == 2 ? '#ffd166' : '#dfe7f1';
    c.beginPath();
    c.moveTo(12, -6);
    c.lineTo(24, 0);
    c.lineTo(12, 6);
    c.fill();
    c.fillStyle = '#e63946';
    c.fillRect(-30, -5, 8, 10);
  }

  c.restore();
}

/* ============================================================
   MAIN RENDER LOOP
   ============================================================ */
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (ts - last) / 1000 || 0);
  last = ts;
  T += dt;

  if (!st || !$('game').classList.contains('on')) return;

  if (sim) {
    acc += dt;
    while (acc >= DT && sim) {
      stepSim();
      acc -= DT;
    }
  } else {
    acc = 0;
  }

  if (st.mode == 'bot' && st.turn == 1 && !sim && !st.over && !botWait) {
    botWait = 1;
    setTimeout(botShot, 1200);
  }

  P.forEach(p => {
    p.dx += (p.x - p.dx) * Math.min(1, 10 * dt);
    p.lean *= Math.pow(.02, dt);
    p.rec *= Math.pow(.001, dt);

    if (p.parts) {
      p.parts.forEach(q => {
        q.vy += G * dt;
        q.x += q.vx * dt;
        q.y += q.vy * dt;
        q.r += q.vr * dt;
        if (q.y > GY - 10) {
          q.y = GY - 10;
          q.vy *= -.35;
          q.vx *= .7;
          q.vr *= .6;
        }
      });
    }
  });

  obstacles.forEach(o => { if (o.shake > 0) o.shake = Math.max(0, o.shake - dt * 4); });

  fx.forEach(f => {
    f.vy += 900 * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.l -= dt;
  });
  fx = fx.filter(f => f.l > 0);

  tx.forEach(t => {
    t.y -= 50 * dt;
    t.l -= dt;
  });
  tx = tx.filter(t => t.l > 0);

  stuck.forEach(s => s.l -= dt * .3);
  stuck = stuck.filter(s => s.l > 0);

  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#000';
  c.fillRect(0, 0, cv.width, cv.height);
  c.setTransform(sc, 0, 0, sc, ox, oy);

  c.save();
  c.beginPath();
  c.rect(-ox / sc, -oy / sc, cv.width / sc, cv.height / sc);
  c.clip();

  scene();
  stuck.forEach(projDraw);

  let aim = null, pts = null;

  if (drag) {
    const a = aimOf();
    aim = a.a;
    const p = P[st.my];
    const r = a.a * PI / 180;
    const s = a.pw / 100 * V * (wsel == 1 ? .8 : 1);

    let x = p.x, y = GY - 70;
    let vx = p.f * Math.cos(r) * s, vy = -Math.sin(r) * s;
    pts = [];

    for (let i = 0; i < 16; i++) {
      for (let k = 0; k < 8; k++) {
        vy += G * .008;
        x += vx * .008;
        y += vy * .008;
      }
      pts.push([x, y]);
    }
  }

  drawObstacles();

  P.forEach((p, i) => drawChar(p, i, i == st.my && drag ? aim : null));

  if (sim) sim.pr.forEach(projDraw);

  if (pts) {
    c.fillStyle = '#fff';
    pts.forEach((q, i) => {
      c.globalAlpha = 1 - i / 18;
      c.beginPath();
      c.arc(q[0], q[1], 6 - i * .2, 0, 7);
      c.fill();
    });
    c.globalAlpha = 1;

    const p = P[st.my];
    const a = aimOf();
    c.font = '900 34px Trebuchet MS';
    c.textAlign = 'center';
    c.lineWidth = 5;
    c.strokeStyle = '#0008';
    const t = Math.round(a.a) + '\u00b0  ' + Math.round(a.pw) + '%';
    c.strokeText(t, p.dx, GY - 190);
    c.fillStyle = '#fff';
    c.fillText(t, p.dx, GY - 190);
  }

  fx.forEach(f => {
    c.globalAlpha = Math.max(0, f.l);
    c.fillStyle = f.c;
    c.fillRect(f.x, f.y, 6, 6);
  });
  c.globalAlpha = 1;

  tx.forEach(t => {
    c.globalAlpha = Math.min(1, t.l);
    c.font = '900 ' + t.z + 'px Trebuchet MS';
    c.textAlign = 'center';
    c.lineWidth = 6;
    c.strokeStyle = '#000a';
    c.strokeText(t.s, t.x, t.y);
    c.fillStyle = t.c;
    c.fillText(t.s, t.x, t.y);
  });
  c.globalAlpha = 1;

  c.restore();
}

requestAnimationFrame(frame);

/* ============================================================
   MENU ACTIONS & FIREBASE ROOMS
   ============================================================ */
function leave() {
  if (ref) {
    ref.off();
    if (isHost) ref.remove().catch(() => { });
    ref = null;
  }
  isHost = false;
  started = false;
  st = null;
  sim = null;
  obstacles = [];
  show('menu');
}

$('xit').onclick = leave;
$('eb').onclick = leave;

$('bBot').onclick = () => {
  const n = nameOf();
  startGame({
    mode: 'bot',
    my: 0,
    a: { name: n, ch: me.ch },
    b: { name: 'Bot', ch: (me.ch + 1 + (Math.random() * 3 | 0)) % 4 },
    sc: pickScene()
  });
};

const needDb = () => {
  if (!db) {
    msg('Multiplayer unavailable (Firebase failed to load).');
    return true;
  }
  return false;
};

function listen() {
  ref.child('shot').on('value', s => {
    const r = s.val();
    if (!r || !st || r.n <= lastN) return;
    lastN = r.n;
    if (r.by === st.my) return;

    if (r.obs) {
      r.obs.forEach((o, i) => {
        if (obstacles[i]) {
          obstacles[i].hp = o.hp;
          obstacles[i].destroyed = !!o.destroyed;
        }
      });
    }

    const go = () => {
      if (sim) return setTimeout(go, 100);
      fire(r.by, r.a, r.pw, r.w, r.sp == null ? -1 : r.sp, r);
    };
    go();
  });

  ref.on('value', s => {
    const r = s.val();
    if (!r) {
      if (started && st && !st.over) {
        started = false;
        ban('Opponent left');
        setTimeout(leave, 1600);
      }
      return;
    }
    if (isHost && r.guest && !started) {
      started = true;
      msg();
      startGame({ mode: 'net', my: 0, a: r.host, b: r.guest, sc: r.scene });
    }
  });
}

$('bHost').onclick = async () => {
  if (needDb()) return;
  const n = nameOf();
  const code = Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random() * 24 | 0]).join('');

  try {
    isHost = true;
    ref = db.ref('rooms/' + code);
    await ref.set({
      host: { name: n, ch: me.ch },
      scene: pickScene(),
      status: 'lobby',
      t: Date.now()
    });
    ref.onDisconnect().remove();
    msg('Room code: ' + code + ' — waiting for a friend...');
    listen();
  } catch (e) {
    isHost = false;
    msg('Could not create room: ' + e.message + ' (check Realtime Database rules)');
  }
};

$('bJoin').onclick = async () => {
  if (needDb()) return;
  const n = nameOf();
  const code = ($('jc').value || '').trim().toUpperCase();
  if (code.length != 4) return msg('Enter the 4-letter code');

  try {
    const r = db.ref('rooms/' + code);
    const s = await r.once('value');
    const d = s.val();

    if (!d) return msg('Room not found');
    if (d.guest || d.status != 'lobby') return msg('Room is full');

    await r.update({ guest: { name: n, ch: me.ch }, status: 'play' });
    ref = r;
    isHost = false;
    started = true;
    msg();
    startGame({ mode: 'net', my: 1, a: d.host, b: { name: n, ch: me.ch }, sc: d.scene });
    listen();
  } catch (e) {
    msg('Join failed: ' + e.message);
  }
};

/* ============================================================
   SIGN IN / SIGN UP
   ============================================================ */
let signup = 0, pendingName = '';

if (auth) {
  auth.onAuthStateChanged(async u => {
    user = u;
    if (u) {
      me.name = u.displayName || pendingName || 'Player';
      $('hi').textContent = 'Hi, ' + me.name + '!';
      try {
        const d = (await db.ref('users/' + u.uid).once('value')).val();
        if (d) { me.ch = d.ch | 0; me.sc = d.sc == null ? 4 : d.sc; }
      } catch (e) { }
      buildMenu();
      /* Only route to menu if splash is already dismissed */
      if (!$('splash').classList.contains('on')) show('menu');
    } else {
      if (st) leave();
      if (!$('splash').classList.contains('on')) show('auth');
    }
  });
} else {
  $('aerr').textContent = 'Firebase failed to load — check your connection.';
}

$('aSw').onclick = () => {
  signup = !signup;
  $('at').textContent = signup ? 'Create your account' : 'Log in to play';
  $('aGo').textContent = signup ? 'SIGN UP' : 'LOG IN';
  $('aSw').textContent = signup ? 'Have an account? Log in' : 'New here? Create account';
  $('aerr').textContent = '';
};

$('aGo').onclick = async () => {
  const e = t => $('aerr').textContent = t;
  const u = $('au').value.trim();
  const p = $('ap').value;
  e('');

  if (!auth) return e('Firebase failed to load.');
  if (!/^[a-zA-Z0-9_]{3,16}$/.test(u)) return e('Username: 3–16 letters, numbers or _');
  if (p.length < 6) return e('Password needs 6+ characters');

  $('aGo').disabled = true;
  const mail = u.toLowerCase() + '@aimit.local';

  try {
    if (signup) {
      pendingName = u;
      const cr = await auth.createUserWithEmailAndPassword(mail, p);
      await cr.user.updateProfile({ displayName: u });
      me.name = u;
      $('hi').textContent = 'Hi, ' + u + '!';
      await db.ref('users/' + cr.user.uid).set({ name: u, ch: 0, sc: 4 });
    } else {
      await auth.signInWithEmailAndPassword(mail, p);
    }
  } catch (x) {
    const m = x.code || x.message || '';
    e(/email-already/.test(m) ? 'Username already taken'
      : /invalid-credential|user-not-found|wrong-password/.test(m) ? 'Wrong username or password'
      : /operation-not-allowed/.test(m) ? 'Enable Email/Password sign-in in Firebase Console'
      : /permission/i.test(m) ? 'Database rules block this — update your rules'
      : m.replace('Firebase: ', ''));
  }

  $('aGo').disabled = false;
};

$('bOut').onclick = () => {
  leave();
  auth && auth.signOut();
};

/* ============================================================
   PWA: SERVICE WORKER + INSTALL BUTTON
   ============================================================ */
let dip = null;

const standalone =
  matchMedia('(display-mode: standalone)').matches ||
  matchMedia('(display-mode: fullscreen)').matches ||
  navigator.standalone;

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isAnd = /android/i.test(navigator.userAgent);

const instBtns = [...document.querySelectorAll('.inst')];
const showInst = v => instBtns.forEach(b => b.style.display = v ? 'flex' : 'none');

if (!standalone && (isIOS || isAnd)) showInst(1);

addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  dip = e;
  if (!standalone) showInst(1);
});

addEventListener('appinstalled', () => {
  dip = null;
  showInst(0);
  msg('Installed! Open Aimit from your home screen.');
});

instBtns.forEach(b => b.onclick = async () => {
  if (dip) {
    dip.prompt();
    const r = await dip.userChoice;
    dip = null;
    if (r.outcome == 'accepted') showInst(0);
    return;
  }

  $('itx').innerHTML = isIOS
    ? 'On iPhone/iPad:<br>tap <b>Share</b> &#11014;&#65039; then <b>Add to Home Screen</b>.<br><br><small>(tap to close)</small>'
    : 'Open your browser menu (&#8942;) and choose <b>Install app</b> / <b>Add to Home screen</b>.<br><br><small>(tap to close)</small>';

  $('ihelp').classList.add('on');
});

$('ihelp').onclick = () => $('ihelp').classList.remove('on');

if ('serviceWorker' in navigator) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => { });
  });
}
</script>
